# XcodeGen 工程定义 —— **唯一工程源文件**；DshTradingNative.xcodeproj 是生成物、不入库。
#
# 工程形态（与 desktop/、apps/mobile 同一先例）：
#   * 独立工程，**不进 pnpm workspace**（pnpm-workspace.yaml 只收 packages/*）；
#   * 构建方式可复现：xcodegen generate + xcodebuild -sdk iphonesimulator build；
#   * DerivedData 落仓内 build/，与 xcodeproj/xcuserdata 一并 gitignore。
#
# 目标分工（一个子目录 = 一个 framework target = 一个可以独立跑测试的边界）：
#   DshTradingContract   Sources/Contract   ← #1 冻结；其余子卡只消费、不修改
#   DshTradingTransport  Sources/Transport  ← 认领子卡可整体替换
#   DshTradingDomain     Sources/Domain
#   DshTradingFeatures   Sources/Features
#   DshTradingAlerts     Sources/Alerts
#   DshTradingOffline    Sources/Offline
#   DshTradingNative     Sources/App        ← App 入口，依赖上面全部
# 测试目标：DshTradingContractTests（macOS 逻辑测试，防漂移机检）
#           + 每个子目录一个 iOS 逻辑测试目标（Tests/<Area>Tests/**）
name: DshTradingNative

options:
  bundleIdPrefix: com.dshtrading
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    # 本机会话的 DSH 文件沙箱内，swiftc 无法给**宏插件**再起一层嵌套沙箱
    # （sandbox-exec: sandbox_apply: Operation not permitted ⇒ 编译报
    #  "external macro implementation type 'ObservationMacros.ObservableMacro' could not be found"），
    # @Observable 因此加载不了，模拟器构建被挡。这个 flag 关掉的是**插件执行沙箱**，
    # 不改变本仓的任何安全边界（不关网络、不关文件权限），加上后标准 xcodebuild 命令可复现。
    OTHER_SWIFT_FLAGS: -disable-sandbox

targets:
  # ---------------------------------------------------------------- 冻结契约面
  DshTradingContract:
    type: framework
    platform: iOS
    sources: [path: Sources/Contract]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.contract
        GENERATE_INFOPLIST_FILE: YES

  # ---------------------------------------------------------------- 子目录骨架
  DshTradingTransport:
    type: framework
    platform: iOS
    sources: [path: Sources/Transport]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.transport
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DshTradingContract

  DshTradingDomain:
    type: framework
    platform: iOS
    sources: [path: Sources/Domain]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.domain
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DshTradingContract

  DshTradingFeatures:
    type: framework
    platform: iOS
    sources: [path: Sources/Features]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.features
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DshTradingContract
      - target: DshTradingDomain

  DshTradingAlerts:
    type: framework
    platform: iOS
    sources: [path: Sources/Alerts]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.alerts
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DshTradingContract
      - target: DshTradingDomain

  DshTradingOffline:
    type: framework
    platform: iOS
    sources: [path: Sources/Offline]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.offline
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DshTradingContract
      - target: DshTradingDomain

  # ---------------------------------------------------------------- App
  DshTradingNative:
    type: application
    platform: iOS
    sources: [path: Sources/App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: DSH Trading
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: DshTradingContract
      - target: DshTradingTransport
      - target: DshTradingDomain
      - target: DshTradingFeatures
      - target: DshTradingAlerts
      - target: DshTradingOffline

  # ---------------------------------------------------------------- 测试目标
  # 防漂移机检：macOS 逻辑测试，直接编译 Sources/Contract 的**同一批文件**
  # （平台无关模块），断言它们与 TS 契约快照一致。
  DshTradingContractTests:
    type: bundle.unit-test
    platform: macOS
    # 注意：**不**把 Generated/contract-snapshot.json 列进 sources —— 它是生成物、不入库，
    # 列进来会让干净工作区里的 \`xcodegen generate\` 直接报 "missing source directory"。
    # 测试从源码相对路径读取快照（#filePath），见 ContractSnapshotFile.load()。
    sources:
      - path: Sources/Contract
      - path: Tests/ContractTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.contract-tests
        GENERATE_INFOPLIST_FILE: YES

  # 各子目录的 iOS 逻辑测试目标（子卡只写 Tests/<Area>Tests/**，不必改本文件）
  DshTradingTransportTests:
    type: bundle.unit-test
    platform: iOS
    sources: [path: Tests/TransportTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.transport-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DshTradingTransport

  DshTradingDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources: [path: Tests/DomainTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.domain-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DshTradingDomain

  DshTradingFeaturesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [path: Tests/FeaturesTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.features-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DshTradingFeatures

  DshTradingAlertsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [path: Tests/AlertsTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.alerts-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DshTradingAlerts

  DshTradingOfflineTests:
    type: bundle.unit-test
    platform: iOS
    sources: [path: Tests/OfflineTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshtrading.ios-native.offline-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DshTradingOffline

schemes:
  # 每一层都能单独编译/被单独验证（便于各卡确认自己那层绿了，不被别人的红挡住）
  DshTradingContract:
    build:
      targets:
        DshTradingContract: all
  DshTradingTransport:
    build:
      targets:
        DshTradingTransport: all
  DshTradingDomain:
    build:
      targets:
        DshTradingDomain: all
  DshTradingFeatures:
    build:
      targets:
        DshTradingFeatures: all
  DshTradingAlerts:
    build:
      targets:
        DshTradingAlerts: all
  DshTradingOffline:
    build:
      targets:
        DshTradingOffline: all
  DshTradingNative:
    build:
      targets:
        DshTradingNative: all
    run:
      config: Debug
  DshTradingContractTests:
    build:
      targets:
        DshTradingContractTests: [test]
    test:
      config: Debug
      targets: [DshTradingContractTests]
  DshTradingTransportTests:
    build:
      targets:
        DshTradingTransportTests: [test]
    test:
      config: Debug
      targets: [DshTradingTransportTests]
  DshTradingDomainTests:
    build:
      targets:
        DshTradingDomainTests: [test]
    test:
      config: Debug
      targets: [DshTradingDomainTests]
  DshTradingFeaturesTests:
    build:
      targets:
        DshTradingFeaturesTests: [test]
    test:
      config: Debug
      targets: [DshTradingFeaturesTests]
  DshTradingAlertsTests:
    build:
      targets:
        DshTradingAlertsTests: [test]
    test:
      config: Debug
      targets: [DshTradingAlertsTests]
  DshTradingOfflineTests:
    build:
      targets:
        DshTradingOfflineTests: [test]
    test:
      config: Debug
      targets: [DshTradingOfflineTests]
