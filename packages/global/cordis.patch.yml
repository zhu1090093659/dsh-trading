# @dshtrading/global —— 全球市场 bundle 的 patch 层（insert-only，README 设计铁律 #1）。
#
# 实装形态抄 @dshtrading/futures：connector/kit 的插件行在 preset 的 agent.cordis.yml
# （preset 级会话隔离）。本 bundle 的职责：
#   1. dsh-trading-global-installer —— host 面常驻安装器插件（src/index.ts）：boot 时
#      幂等贡献 global-trader 切片（经 base/presets 统一装配）；
#   2. host 面数据行：@dshtrading/connector-jin10/dataplane 注册 (market=global,
#      provider=jin10) 到 tradingMarketDataRegistry（GUI 行情桥）+ provide
#      tradingGlobalMarketData。该行 2026-09-13 起曾在 base（当时 global 无 bundle
#      没有认领者）；market-group 平权后由本 bundle 认领，base 不再持有。
#
# 注意：patch 文件必须保持「顶层 YAML 数组」形状（loadProfile → parsePatchList 对非数组
# 直接抛错）；只允许 insert（按 id 打已存在行 = 整行替换，多市场并存会互相覆盖）。
- insert:
    - id: dsh-trading-global-installer
      name: '@dshtrading/global'

    # host 面数据行：注册 global 市场行情服务（金十源）。
    - id: dsh-trading-global-dataplane-jin10
      name: '@dshtrading/connector-jin10/dataplane'
      inject: ['tradingMarketDataRegistry']
      config:
        enabled: true
