# @dshtrading/base —— 市场无关共享行的唯一拥有者（README 设计铁律 #1）。
#
# 本文件只允许 insert（patch 非 insert 语义是按 id 整行替换，多市场并存会互相
# 覆盖）；共享行一律只在本层定义一次，市场 bundle 不得 replace。
#
# 当前三类语义（2026-08-29 web 宿主实测修正，vendor/loader + vendor/include 源码为准）：
#   1. insert 行：dsh-trading-base-gate —— 本包的统一审批监听器插件（见 src/index.ts）：
#      对 <market>_(place|cancel)_order 且 dryRun!==true 的工具调用返回 ask 交宿主
#      审批面；headless 无应答者时宿主降级为 deny（fail-closed 特性）。
#      该 id 全仓唯一，insert 在任何宿主都安全。
#   2. 同 id 覆盖行：agent-preset-registry —— 部署默认预设 default=master（0.1.7
#      cohort：preset 平面改为 registry 行声明 + 运行时注册，磁盘 roots 机制已随
#      @deepseek-ai/dsh-agent-presets 停发而消失；角色组合改由 @dshtrading/base/presets
#      安装器经 ctx.agentPresets.register() 动态注册）。
#      **为什么不能 insert**：web 宿主的 web-app 层已有 agent-preset-registry 行，insert
#      无 id 条目一律 append 新行，loader.update 对重复 id 直接抛
#      「duplicate loader entry id」——web profile 会启动崩溃（0.1.5 世代 agent-presets
#      行同款实测）。覆盖条目语义：行存在 → 按 key 覆盖（config 全键 restate）；行不
#      存在（headless）→ 仅 Loader 警告并跳过，不致命。headless 部署需要 registry 时，
#      由部署方在 profile 级 cordis.patch.yml 自行 insert 同一行（见 README 开发期安装
#      节；trading-dev 即如此）。default=master（owner 2026-09-06 裁决：角色整合完成后，
#      新会话默认进「大师」团队主导者，见 .agents/notes/implemented/architecture/
#      2026-09-06-unified-trading-role-presets.md；用户层 settings 仍可覆盖）。
#      包名解析依赖本包 dependencies 里的
#      @deepseek-ai/dsh-agent-preset-registry（进 profile 安装闭包，S3 坑 3）。
#
#   3. 条件禁用行（issue #88）：host 半硬 inject web 宿主服务（webServer /
#      workspaceRegistry / connection）的 npm 插件行，用 `disabled: !!js (...)`
#      按「宿主树里是否存在对应服务提供方行」开关。headless 宿主（dsh-headless
#      层，trading-dev / trading-all）没有这些服务，缺服务的行永久 pending，
#      assertEntriesActivated 直接终止启动（2026-09-08 实测 4 行，issue #88）。
#      先例：dsh-trading-dynamic-capabilities（issue #62，按 cordis-host-runner 行判定；
#      0.1.7 cohort 起该行随 cordis_define/cordis_run 移除而删除，条件禁用写法仍适用
#      于本文件其余 host 半行）。
#
# 脚手架阶段遗留的 insert-only 约定不变：后续共享行（组合管理/风控工具行、
# credentials 引用约定行 [S4]）继续追加到本文件的 insert 列表。
- insert:
    - id: dsh-trading-base-gate
      name: '@dshtrading/base'

    # One owner composes role presets from enabled market bundle rows; no market installer races.
    - id: dsh-trading-role-presets
      name: '@dshtrading/base/presets'

    # 市场/数据源路由（2026-08-29 设置驱动单预设重构，docs/exchange-routing.md）：
    # host 面常驻，注册 dshtrading settings namespace + provide tradingMarketRouter；
    # 连接器 apply 时 consult activeProvider(market)——用户设置选谁谁激活。
    # 市场无关共享行（四市场共用），只由 base 拥有（铁律 #1/#4）。
    - id: dsh-trading-market-router
      name: '@dshtrading/router'

    # 失效信号事件总线（issue #30 / P1）：provide tradingEvents 服务（emit/subscribe/
    # per-store revision，零 HTTP 零业务数据）；能力包工具与桥写入状态后 emit，
    # /dshtrading/api/events（SSE）以本服务为数据源出浏览器。
    - id: dsh-trading-eventbus
      name: '@dshtrading/eventbus'

    # 策略 Agent 产出管线（issue #31 / P2，dataplane 行同款 subpath 插件先例）：
    # strategy_author + strategy_backtest host 平面工具（全会话可见，owner 裁决 D4），
    # 自定义策略 file store 落 ~/.dsh/strategies/custom.json；写后 emit tradingEvents('strategies')。
    - id: dsh-trading-strategies
      name: '@dshtrading/strategies/plugin'

    # 自选股升位（issue #32 / P3，subpath 插件先例）：watchlist_list/add/remove/select
    # host 平面工具（跨市场、全会话可见），file store 落 ~/.dsh/watchlists.json +
    # ~/.dsh/selection.json；写后 emit tradingEvents('watchlists'|'selection')。
    - id: dsh-trading-watchlist
      name: '@dshtrading/watchlist/plugin'

    # 指标能力收口（issue #33 / P4；issue #63 扩展）：provide tradingCustomIndicators /
    # tradingChartActivations 单实例 store 服务（桥与工具共享缓存），indicator_author/
    # indicator_delete 与 indicator_list/indicator_activate/indicator_deactivate host 平面
    # 注册；写后 emit tradingEvents('indicators'|'chart')。
    - id: dsh-trading-indicators
      name: '@dshtrading/indicators/plugin'

    # 知识能力收口（issue #33 / P4）：provide tradingKnowledgeCards 单实例 store 服务，
    # knowledge_ingest/search/graph host 平面注册；写后 emit tradingEvents('knowledge')。
    - id: dsh-trading-knowledge
      name: '@dshtrading/knowledge/plugin'

    # 统一资产台账（issue #65）：provide tradingHoldings 单实例服务（holdings
    # file store + fx 汇率服务；桥与 holdings_stage/holdings_list 共享，台账落
    # ~/.dsh/holdings/book.json、fx 缓存落 ~/.dsh/holdings/fx-cache.json）；
    # 工具 host 平面注册；写后 emit tradingEvents('holdings')。包名解析依赖本包
    # dependencies 里的 @dshtrading/holdings（进 profile 安装闭包，S3 坑 3 同款）。
    - id: dsh-trading-holdings
      name: '@dshtrading/holdings/plugin'

    # agent 原生只读市场/账户工具（issue #86 / 审计缺口卡 G1+G2）：
    # host 平面注册 <market>_get_orderbook/_get_trades（tradingMarketDataRegistry）与
    # <market>_get_positions/_get_orders/_get_fills/_get_balance/_get_order
    # （tradingTradeRegistry）——registry 驱动、零连接器接线即覆盖全部 provider
    # （含第三方）。可选方法未实现 → TRADING_NOT_IMPLEMENTED，绝不返回空数组
    # 冒充「无持仓/无挂单/空盘口」；纯只读，不命中下单闸门正则（铁律 #3 不涉及）。
    # 包名解析依赖本包 exports 的 ./market-tools 子路径（base 拥有全部市场无关行，
    # 铁律 #1；research-tools 为 preset 平面先例，本行为 host 平面）。
    - id: dsh-trading-market-tools
      name: '@dshtrading/base/market-tools'

    # 金十数据 MCP 连接器（2026-09-13）：市场快讯/资讯/财经日历/全球品种报价。
    # host 平面注册九个只读工具 —— flash_list/flash_search/news_list/news_search/
    # news_get/econ_calendar/global_instruments/global_quote/global_klines；内容是
    # **跨市场**的（宏观/大宗/外汇/A 股/地缘），故为市场无关共享行、归 base 所有
    # （铁律 #1），host 行注册一次全会话可见（与上行 market-tools 同款形态）。
    # 纯只读：不命中下单闸门正则（铁律 #3 不涉及）。凭证 BYOK：设置中心
    # dshtrading.credentials.jin10.token 优先、环境变量 JIN10_MCP_TOKEN 兜底，
    # 每次请求惰性解析（先例：hithink 2026-09-12 凭证修复）；缺凭证时工具调用报
    # TRADING_CREDENTIALS_MISSING 并给出配置路径，行本身照常挂载。
    # 快讯/资讯只下发元数据（标题/时间/链接 + 文章导语），正文零再分发（铁律 #5）。
    # 包名解析依赖本包 dependencies 里的 @dshtrading/connector-jin10（进 profile
    # 安装闭包，S3 坑 3 同款）。
    - id: dsh-trading-connector-jin10
      name: '@dshtrading/connector-jin10'
      config:
        enabled: true

    # global 市场数据面：行 dsh-trading-global-dataplane-jin10（provide
    # tradingGlobalMarketData + 注册 (global, jin10) 进 tradingMarketDataRegistry）
    # 2026-09-15 market-group 平权起由 @dshtrading/global bundle 认领，不再归 base
    # （铁律 #1 的「市场无关」边界回到原位——global 有了自己的市场 bundle）。凭证
    # 仍由上一行的主连接器闭包承载（设置中心 dshtrading.credentials.jin10.token
    # 优先、JIN10_MCP_TOKEN 兜底，逐请求惰性解析）。

    # 官方 Office 技能（2026-10-03）：Word/PPT/Excel 的创建、编辑与结构检查正文由官方
    # @deepseek-ai/dsh-skill-office 随包提供，本仓只接线不复制正文（一个事实只有一个家）。
    # **沿用官方 id skill-office**：宿主插件按 id 整行替换（last write wins），将来载体层或
    # 用户 profile 再挂同一行是覆盖而非双挂；另起 dsh-trading- 前缀会让两个 provider 同时
    # 注册同样三个技能，同名优先级与卸载清理直接回归。
    # 不写 assetRoot/node/cli —— 官方默认值在 CLI 与桌面两种形态都成立（2026-10-03 实测）：
    #   assetRoot = 包内 assets/（含 office-docx/pptx/xlsx + scripts/check_office.py）
    #   node      = process.execPath（桌面 host 是 spawn 出来的真 Node 子进程，非 Electron 进程）
    #   cli       = import.meta.resolve('@deepseek-ai/libreoffice-kit/package.json') 同级 lib/cli.js
    # 三者都落在宿主安装树（全局 dsh 的 node_modules，或 desktop resources/runtime/host）；
    # trading-web 的 profile node_modules 不提供它们，但 loader 从安装锚点解析，本仓 node_modules
    # 也不在 asar 内，所以不需要官方桌面那个 ASAR 重定向钩子。
    # 与 workspace-dependencies 同门控：没有 primary-runtime 载荷时 Office 能力整块显式缺席，
    # 绝不回退系统 Python / PATH。行安全：office provider 只 inject skills，web 宿主不 disable 本行。
    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      disabled: !!js "!(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME)"

    # 官方独立解释器与依赖绝对路径（2026-10-03）：load_workspace_dependencies 返回随包 Python
    # （python-docx/python-pptx/openpyxl/pandas/lxml/Pillow/XlsxWriter）与 node/pnpm 的绝对路径，
    # 供 Office 技能在不依赖系统 Python、不改 PATH 的前提下执行。
    # 形态与官方 @deepseek-ai/dsh-sdk-app 完全一致：source 由 env 派生，缺 env 整行缺席（显式失败，
    # 绝不静默换系统实现）。**不捆绑 359MB 载荷**：payload 由部署方提供（例如官方桌面已安装的
    # $HOME/.dsh/dsh-runtimes/dsh-primary-runtime，或本仓桌面载荷将来 stage 的同名目录），只读沿用、
    # 不复制。省略 root ⇒ 就地校验、零拷贝；需要装进 trading home 的部署可在 profile 层补
    # root=$DSH_HOME/dsh-runtimes/dsh-primary-runtime。
    - id: workspace-dependencies
      name: '@deepseek-ai/dsh-tool-workspace-dependencies'
      disabled: !!js "!(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME)"
      config:
        source: !!js "process.getBuiltinModule('node:path').resolve(process.env.DSH_PRIMARY_RUNTIME ?? process.env.DSH_BUNDLED_PRIMARY_RUNTIME ?? '')"


- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: master
