# @dshtrading/base —— 市场无关共享行的唯一拥有者（README 设计铁律 #1）。
#
# 本文件只允许 insert（patch 非 insert 语义是按 id 整行替换，多市场并存会互相
# 覆盖）；共享行一律只在本层定义一次，市场 bundle 不得 replace。
#
# 当前三类语义（2026-08-29 web 宿主实测修正，vendor/loader + vendor/include 源码为准）：
#   1. insert 行：dsh-trading-base-gate —— 本包的统一审批监听器插件（见 src/index.ts）：
#      对 <market>_(place|cancel)_order 且 dryRun!==true 的工具调用返回 ask 交宿主
#      审批面；headless 无应答者时宿主降级为 deny（fail-closed 特性）。
#      该 id 全仓唯一，insert 在任何宿主都安全。
#   2. 同 id 覆盖行：agent-presets —— 统一 preset root 配置（S3 机制）。
#      **为什么不能 insert**：web 宿主的 web-app 层已有 agent-presets 行，insert 无 id
#      条目一律 append 新行，loader.update 对重复 id 直接抛
#      「duplicate loader entry id」——web profile 会启动崩溃（trading-web 实测）。
#      覆盖条目语义：行存在 → 按 key 覆盖（config 全键 restate，不合并——所以 default/
#      includeShippedRoot/includeUserRoot 必须全带）；行不存在（headless）→ 仅 Loader
#      警告并跳过，不致命。headless 部署需要该 root 时，由部署方在 profile 级
#      cordis.patch.yml 自行 insert 同一行（见 README 开发期安装节；trading-dev 即如此）。
#      roots 用市场自有目录 ~/.dsh-trading-presets（bundle 安装器自安装目的地，
#      不混入 ~/.dsh/.agent-presets 用户创作区）；default=master（owner 2026-09-06
#      裁决：角色整合完成后，新会话默认进「大师」团队主导者，取代 S3 期
#      default=standard 的过渡口径，见 .agents/notes/implemented/architecture/
#      2026-09-06-unified-trading-role-presets.md；用户层 settings 仍可覆盖）。
#      包名解析依赖本包 dependencies 里的
#      @deepseek-ai/dsh-agent-presets（进 profile 安装闭包，S3 坑 3）。
#
#   3. 条件禁用行（issue #88）：host 半硬 inject web 宿主服务（webServer /
#      workspaceRegistry / connection）的 npm 插件行，用 `disabled: !!js (...)`
#      按「宿主树里是否存在对应服务提供方行」开关。headless 宿主（dsh-headless
#      层，trading-dev / trading-all）没有这些服务，缺服务的行永久 pending，
#      assertEntriesActivated 直接终止启动（2026-09-08 实测 4 行，issue #88）。
#      先例：dsh-trading-dynamic-capabilities（issue #62，按 cordis-host-runner 行判定）。
#
# 脚手架阶段遗留的 insert-only 约定不变：后续共享行（组合管理/风控工具行、
# credentials 引用约定行 [S4]）继续追加到本文件的 insert 列表。
- insert:
    - id: dsh-trading-base-gate
      name: '@dshtrading/base'

    # One owner composes role presets from enabled market bundle rows; no market installer races.
    - id: dsh-trading-role-presets
      name: '@dshtrading/base/presets'

    # 市场/数据源路由（2026-08-29 设置驱动单预设重构，docs/exchange-routing.md）：
    # host 面常驻，注册 dshtrading settings namespace + provide tradingMarketRouter；
    # 连接器 apply 时 consult activeProvider(market)——用户设置选谁谁激活。
    # 市场无关共享行（四市场共用），只由 base 拥有（铁律 #1/#4）。
    - id: dsh-trading-market-router
      name: '@dshtrading/router'

    # 交易设置一级菜单（2026-08-29 浏览器半包，docs/exchange-routing.md §6）：
    # dsh.client 双面包（node 半空 apply + 浏览器半注册 settings.section id=trading）。
    # 浏览器侧由 web 宿主的 dsh-client-modules 扫描 loader entries 进 __DSH_BOOT__；
    # headless 宿主无 modules 行，此包被解析为普通 host 行（空 apply 无害）。
    - id: dsh-trading-client-ui-settings
      name: '@dshtrading/client-ui-settings'

    # 失效信号事件总线（issue #30 / P1）：provide tradingEvents 服务（emit/subscribe/
    # per-store revision，零 HTTP 零业务数据）；能力包工具与桥写入状态后 emit，
    # /dshtrading/api/events（SSE）以本服务为数据源出浏览器。
    - id: dsh-trading-eventbus
      name: '@dshtrading/eventbus'

    # 策略 Agent 产出管线（issue #31 / P2，dataplane 行同款 subpath 插件先例）：
    # strategy_author + strategy_backtest host 平面工具（全会话可见，owner 裁决 D4），
    # 自定义策略 file store 落 ~/.dsh/strategies/custom.json；写后 emit tradingEvents('strategies')。
    - id: dsh-trading-strategies
      name: '@dshtrading/strategies/plugin'

    # 自选股升位（issue #32 / P3，subpath 插件先例）：watchlist_list/add/remove/select
    # host 平面工具（跨市场、全会话可见），file store 落 ~/.dsh/watchlists.json +
    # ~/.dsh/selection.json；写后 emit tradingEvents('watchlists'|'selection')。
    - id: dsh-trading-watchlist
      name: '@dshtrading/watchlist/plugin'

    # 指标能力收口（issue #33 / P4；issue #63 扩展）：provide tradingCustomIndicators /
    # tradingChartActivations 单实例 store 服务（桥与工具共享缓存），indicator_author/
    # indicator_delete 与 indicator_list/indicator_activate/indicator_deactivate host 平面
    # 注册；写后 emit tradingEvents('indicators'|'chart')。
    - id: dsh-trading-indicators
      name: '@dshtrading/indicators/plugin'

    # dsh-tool-cordis 动态包能力开放（issue #35 / P6，owner 裁决 D5，硬前置 P0 服务缝
    # 闸门已落地）：cordis_inspect_* / cordis_define / cordis_run / cordis_stop /
    # cordis_undefine 7 工具进 trading profile。信任级 = bash（官方声明）；动态包
    # session-scoped、重启即散、浏览器半需人工审批；服务缝闸门兜底实盘边界。
    # 行安全（issue #62）：tool-cordis 硬 inject dynamicCordisRunner/cordisInspect，
    # 唯一提供方是 dsh-web-app 层的 cordis-host-runner 行；裸 dsh-base 自定义
    # profile（quick start 补 web-app 层前的中间态）与 dsh-headless 无头 profile
    # 缺该行，工具挂不上服务即永久 pending，宿主 assertEntriesActivated 启动即崩。
    # 故条件禁用：宿主树存在 cordis-host-runner 行（web/desktop profile）才启用，
    # 其余宿主降级为无动态包工具（fail-soft，与其余 client 行 headless 无害同款）。
    - id: dsh-trading-dynamic-capabilities
      name: '@deepseek-ai/dsh-tool-cordis'
      disabled: !!js (!([...loader.entries()].some((entry) => entry.options.name === '@deepseek-ai/dsh-cordis-host-runner')))

    # 知识能力收口（issue #33 / P4）：provide tradingKnowledgeCards 单实例 store 服务，
    # knowledge_ingest/search/graph host 平面注册；写后 emit tradingEvents('knowledge')。
    - id: dsh-trading-knowledge
      name: '@dshtrading/knowledge/plugin'

    # 统一资产台账（issue #65）：provide tradingHoldings 单实例服务（holdings
    # file store + fx 汇率服务；桥与 holdings_stage/holdings_list 共享，台账落
    # ~/.dsh/holdings/book.json、fx 缓存落 ~/.dsh/holdings/fx-cache.json）；
    # 工具 host 平面注册；写后 emit tradingEvents('holdings')。包名解析依赖本包
    # dependencies 里的 @dshtrading/holdings（进 profile 安装闭包，S3 坑 3 同款）。
    - id: dsh-trading-holdings
      name: '@dshtrading/holdings/plugin'

    # agent 原生只读市场/账户工具（issue #86 / 审计缺口卡 G1+G2）：
    # host 平面注册 <market>_get_orderbook/_get_trades（tradingMarketDataRegistry）与
    # <market>_get_positions/_get_orders/_get_fills/_get_balance/_get_order
    # （tradingTradeRegistry）——registry 驱动、零连接器接线即覆盖全部 provider
    # （含第三方）。可选方法未实现 → TRADING_NOT_IMPLEMENTED，绝不返回空数组
    # 冒充「无持仓/无挂单/空盘口」；纯只读，不命中下单闸门正则（铁律 #3 不涉及）。
    # 包名解析依赖本包 exports 的 ./market-tools 子路径（base 拥有全部市场无关行，
    # 铁律 #1；research-tools 为 preset 平面先例，本行为 host 平面）。
    - id: dsh-trading-market-tools
      name: '@dshtrading/base/market-tools'

    # 中心化 i18n 语言包（feat/i18n-zh-cn）：注册「简体中文」(zh-CN) 进宿主
    # Settings → General 语言目录，并为全部 dshtrading.* 命名空间注册 zh-CN
    # 词典（构建期 import 各 UI 包 locales.ts 纯数据模块，zh-CN ≡ zh 零漂移）。
    # 纯浏览器半语言包（dsh-web dsh-i18n 范式），headless 宿主空 apply 无害。
    # 包名解析依赖本包 dependencies 里的 @dshtrading/dsh-i18n（进 profile 安装
    # 闭包，S3 坑 3 同款；缺行 = npm 新装 profile 启动即 ERR_MODULE_NOT_FOUND，
    # issue #60 实测）。
    - id: dsh-trading-dsh-i18n
      name: '@dshtrading/dsh-i18n'

    # 交易 GUI 壳（第二阶段富途式三栏，2026-08-30）：左栏市场/自选遮蔽
    # sidebar.workspaces、中栏 conversation.view 加行情 tab、右栏 shell.overlay
    # 会话面板；node 半注册 /dshtrading/api 行情桥（web 宿主，headless 挂起无害）。
    - id: dsh-trading-client-ui-trading
      name: '@dshtrading/client-ui-trading'

    # 预置指标提供插件（2026-08-30 指标插件化）：client 半 provide
    # tradingIndicators 服务（IndicatorRegistry，预置 MA/EMA/BOLL/MACD/RSI/KDJ）；
    # 社区/自定义指标插件 inject 该服务 register definition 即可上榜。
    # headless 宿主解析为空 apply host 行，无害。
    - id: dsh-trading-client-ui-indicators
      name: '@dshtrading/client-ui-indicators'

    # 策略中栏视图（issue #34 / P5 拆包）：client 半 inject tradingStageViews
    # 注册「策略」tab + tool.call.toolview 富卡片（strategy_backtest/author）；
    # 引擎经 @dshtrading/strategies 纯库 import，桥走 shell 的 tradingBridge
    # 服务。headless 宿主解析为空 apply host 行，无害。
    - id: dsh-trading-client-ui-strategies
      name: '@dshtrading/client-ui-strategies'

    # 知识库中栏视图（issue #34 / P5 拆包）：client 半 inject tradingStageViews
    # 注册「知识库」tab；force-graph 力导图谱随本包打包（shell 已卸下该依赖）。
    # headless 宿主解析为空 apply host 行，无害。
    - id: dsh-trading-client-ui-knowledge
      name: '@dshtrading/client-ui-knowledge'

    # 大师金句活动词语言包（2026-09-05）：client 半注册「中文 · 大师金句」
    # （zh-masters，fallback zh）语言目录项 + 覆盖宿主 chat.deepDiving 单键
    # （输入框上方轮次状态行「深度求索中...」）为利弗莫尔/巴菲特/索罗斯等
    # 金句并定时轮换；(ns, locale) 单一占主语义下的语言包补位范式
    # （dsh-trading-dsh-i18n 同款）。headless 宿主解析为空 apply host 行，无害。
    - id: dsh-trading-client-ui-masters-quotes
      name: '@dshtrading/client-ui-masters-quotes'

    # 自动更新插件（2026-09-04）：设置面板一级菜单「软件更新」（settings.section
    # order 20）+ node 半 /dshtrading/api/updater 桥（GitHub Releases 检测 +
    # @dshtrading/* 家族增量更新）。node 半依赖 webServer/connection（headless
    # 挂起无害）；增量通道只作用于桌面版 seeded profile（.dsh-desktop-seed.json
    # 标记），dev/headless profile 降级为发布页链接。包名解析依赖本包
    # dependencies 里的 @dshtrading/client-ui-updater（进 profile 安装闭包，
    # S3 坑 3 同款）。
    - id: dsh-trading-client-ui-updater
      name: '@dshtrading/client-ui-updater'

    # 会话归纳管理（2026-09-06，npm 复用 dsh-web 项目同款插件）：单行同时挂
    # host 半（会话集中清单/批量归档恢复/家族级联物理删除/自动归档与清理
    # 策略调度器/dsh-session-archive HTTP 路由）与浏览器半（web 宿主
    # dsh.client 模块扫描进插件名册，由本包 lib/client.js 提供）。市场无关
    # 共享行，归 base 所有（铁律 #1）。自动归档/自动清理默认均关
    # （DEFAULT_AUTO_CONFIG，需用户在设置面板显式开启），insert 不改变
    # 交易会话数据安全面。包名解析依赖本包 dependencies 里的
    # @linxin666/dsh-session-archive（进 profile 安装闭包，S3 坑 3 同款）。
    # 行安全（issue #88）：host 半硬 inject webServer + workspaceRegistry，
    # headless 宿主缺服务即永久 pending → 启动即崩；按提供方行条件禁用
    # （见文件头「条件禁用行」）。
    - id: dsh-trading-session-archive
      name: '@linxin666/dsh-session-archive'
      disabled: !!js (![...loader.entries()].some((entry) => entry.options.name === '@deepseek-ai/dsh-host-webserver') || ![...loader.entries()].some((entry) => entry.options.name === '@deepseek-ai/dsh-workspace'))

    # IM 机器人接入（2026-09-06，npm 复用社区插件 @xmanrui/dsh-im）：飞书/微信/
    # 钉钉/企业微信/QQ/Slack/Telegram/Discord/WhatsApp 九渠道机器人接入，
    # 单行双半：host 半（渠道连接/流式回复，凭据只进宿主受保护凭据存储）+
    # 浏览器半（设置 → IM机器人 配置面，section order 21，与 updater 的
    # order 20 相邻不冲突）。市场无关共享行，归 base 所有（铁律 #1）。
    # 凭据须用户在设置面板显式配置，未配置时各渠道空闲待命，insert 不改变
    # 交易会话数据安全面。包名解析依赖本包 dependencies 里的
    # @xmanrui/dsh-im（进 profile 安装闭包，S3 坑 3 同款）。^4.11.0：落地
    # 时刻 4.12/4.13 尚在 pnpm minimumReleaseAge 24h 冷却期内，caret 待其
    # 出冷却后 pnpm update 自然跟进（session-archive 同款选版纪律）。
    # 注意：本行即内置安装，勿再对 profile 执行 `dsh plugin add
    # @xmanrui/dsh-im`——其自带 patch（id xmanrui-dsh-im）会与本行重复
    # 挂载同一插件，设置面二次注册。
    # 行安全（issue #88）：host 半硬 inject connection/credentials/typertGateway，
    # headless 宿主缺 connection 即永久 pending → 启动即崩；按提供方行条件禁用
    # （见文件头「条件禁用行」）。
    - id: dsh-trading-im
      name: '@xmanrui/dsh-im'
      disabled: !!js (![...loader.entries()].some((entry) => entry.options.name === '@deepseek-ai/dsh-client-connection'))

    # 使用统计（2026-09-08，npm 复用 dsh-web 项目同款插件 @linxin666/dsh-usage）：
    # 单行双半：host 半（会话事件流折叠成 token 账本落 $DSH_HOME/dsh-usage/
    # usage-ledger.json + 各 provider 余额/套餐配额轮询探针 + /api/dsh-usage 路由）
    # + 浏览器半（设置一级菜单「使用统计」，section order 151）。凭据经宿主凭据缝
    # （llm-pi-ai 记录 / apiKeyEnv 引用）解析，密钥不出宿主进程。
    # 适配点：本产品不含 dsh-pet（宠物），宠物气泡默认 off（插件设置面板可随时
    # 改回 always/change，属用户可见项）；账本随 DSH_HOME=~/.dsh-trading 隔离，
    # 不污染宿主 ~/.dsh。市场无关共享行，归 base 所有（铁律 #1）。
    # 包名解析依赖本包 dependencies 里的 @linxin666/dsh-usage（进 profile 安装
    # 闭包，S3 坑 3 同款）。^0.3.17：落地时刻 0.3.18 尚在 pnpm minimumReleaseAge
    # 24h 冷却期内，caret 待其出冷却后 pnpm update 自然跟进（session-archive 同款）。
    # 行安全（issue #88）：host 半硬 inject webServer，headless 宿主缺服务即
    # 永久 pending → 启动即崩；按提供方行条件禁用（见文件头「条件禁用行」）。
    - id: dsh-trading-usage
      name: '@linxin666/dsh-usage'
      disabled: !!js (![...loader.entries()].some((entry) => entry.options.name === '@deepseek-ai/dsh-host-webserver'))
      config:
        bubbleMode: 'off'

    # 插件管理（2026-09-08，npm 复用 dsh-web 项目同款插件
    # @linxin666/dsh-client-ui-plugin-manager）：官方「插件」设置区的
    # Plugin manager 标签页（settings.plugins.tab order 20），npm/git 安装、
    # 启用开关、更新校验、卸载、安装冲突回滚与「让 agent 修」修复会话。
    # 双通道：官方 installer 通道存在时走 /plugin-installer RPC；npm 发布版
    # web 运行时无该通道，由本包 host 半挂 loopback 网关、派生官方 dsh CLI
    # 写入 profile（唯一写者）。CLI 解析顺序 = 宿主 PATH → 宿主入口向上
    # node_modules/.bin/dsh → darwin /opt/homebrew|/usr/local/bin/dsh；
    # 桌面版自带 runtime 无全局 CLI，由 desktop 构建期投放
    # runtime/host/node_modules/.bin/dsh 垫片补齐（本变更同批落地）。
    # 市场无关共享行，归 base 所有（铁律 #1）。写入仅限本机 loopback
    # （socket+Host+Origin+sec-fetch-site 四重校验，非 loopback 403）。
    # 隐私面：浏览器半每日一次匿名安装心跳到 dsh-market.com（随机
    # localStorage id + 包名，无对话数据/无 IP），详见 Agent Note。
    # 行安全（issue #88）：host 半硬 inject webServer，headless 宿主缺服务即
    # 永久 pending → 启动即崩；按提供方行条件禁用（见文件头「条件禁用行」）。
    - id: dsh-trading-plugin-manager
      name: '@linxin666/dsh-client-ui-plugin-manager'
      disabled: !!js (![...loader.entries()].some((entry) => entry.options.name === '@deepseek-ai/dsh-host-webserver'))

    # 模型能力声明（2026-09-08，npm 复用 dsh-web 项目同款插件
    # @linxin666/dsh-client-ui-model-capabilities）：在官方「模型」设置页的
    # 自定义 provider 卡片（llm-pi-ai 家族）内就地声明每模型的图片输入与
    # 推理档位（settings.models.provider-card keyed slot + footer 归档区），
    # 并支持 provider 级禁用/恢复归档。写回官方 llm-pi-ai settings
    # namespace（整数组覆盖，非本插件字段原样保留），无 DSH 源码改动。
    # host 半只注册自身 namespace dsh-model-capabilities（禁用 provider 归档）。
    # 适配点：本仓 llm-pi-ai 路由（kimi-coding / zai-coding-cn 等）即在该
    # 卡片体系内，能力声明直接生效；llm-deepseek 固定目录不在覆盖范围
    # （官方能力面自带）。市场无关共享行，归 base 所有（铁律 #1）。
    - id: dsh-trading-model-capabilities
      name: '@linxin666/dsh-client-ui-model-capabilities'

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: master
    roots:
      - path: ~/.dsh-trading-presets
        trust: user
    includeShippedRoot: true
    includeUserRoot: true
