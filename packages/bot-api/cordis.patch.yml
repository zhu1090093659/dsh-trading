# @dshtrading/bot-api —— bot API 平面 bundle 的 patch 层（insert-only，README 设计铁律 #1）。
#
# 平面归属（design/bot-and-auto-trading.md §10 三平面）：bot API 平面**两者都装**——
# bot 的 edge 面与 GUI 驾驶舱都消费 /dshtrading/api。所以本行既进 trading-bot profile
# 的 bundles，也进 GUI profile 的 bundles。
#
# 2026-10-01 P1：本包是 @dshtrading/client-ui-trading 的 **node 半整体搬出**
# （bridge.ts / sse.ts / tasks/* / ttl-cache.ts）。桥本来就零浏览器依赖，其 import 全部
# 落在 host 平面；搬家的目的只是把「/dshtrading/api 服务面」从 GUI 包的安装闭包里摘出来。
# 客户端半（React 视图）仍留在 @dshtrading/client-ui-trading，行 dsh-trading-client-ui-trading
# 也仍由 @dshtrading/gui bundle 拥有。
#
# 注意：patch 文件必须保持「顶层 YAML 数组」形状（loadProfile → parsePatchList 对非数组
# 直接抛错）；只允许 insert（按 id 打已存在行 = 整行替换，多 bundle 并存会互相覆盖）。
- insert:
    # /dshtrading/api HTTP 面 + SSE + 定时任务账本/runner/service 与工具行。
    - id: dsh-trading-bot-api
      name: '@dshtrading/bot-api'
