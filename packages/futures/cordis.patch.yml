# @dshtrading/futures —— 期货市场 bundle 的 patch 层（insert-only，README 设计铁律 #1）。
#
# 实装形态抄 @dshtrading/cn：connector/kit 的插件行在 preset 的 agent.cordis.yml
# （preset 级会话隔离）。本 bundle 的职责：
#   1. dsh-trading-futures-installer —— host 面常驻安装器插件（src/index.ts）：boot 时
#      幂等贡献 futures-trader 切片（经 base/presets 统一装配）；
#   2. host 面数据行：@dshtrading/connector-hithink/futures-dataplane 注册
#      (market=futures, provider=hithink) 到 tradingMarketDataRegistry（GUI 行情桥）。
#
# 注意：patch 文件必须保持「顶层 YAML 数组」形状（loadProfile → parsePatchList 对非数组
# 直接抛错）；只允许 insert（按 id 打已存在行 = 整行替换，多市场并存会互相覆盖）。
- insert:
    - id: dsh-trading-futures-installer
      name: '@dshtrading/futures'

    # host 面数据行（issue #97）：注册 futures 市场行情服务（同花顺期货源）。
    - id: dsh-trading-futures-dataplane
      name: '@dshtrading/connector-hithink/futures-dataplane'
      config:
        enabled: true
