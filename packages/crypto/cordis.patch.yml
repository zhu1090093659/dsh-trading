# @dsh-trading/crypto —— crypto 市场 bundle 的 patch 层（insert-only，README 设计铁律 #1）。
#
# 架构修订（2026-08-29 主 agent 决策）：connector/kit 的插件行在 preset 的
# agent.cordis.yml（preset 级会话隔离——tools/skills 注册表按 scope 分层，preset scope
# 内注册的工具不进入 standard 会话）。本 bundle 的职责：
#   1. dsh-trading-crypto-installer —— host 面常驻安装器插件（src/index.ts）：boot 时
#      幂等自安装 crypto-trader preset 到 ~/.dsh-trading-presets。自安装必须在 bundle
#      层而非 kit 插件（kit 行在 preset 平面，preset 不存在则 kit.apply() 永不运行）；
#   2. 依赖安装载体：preset 行按 bare 包名从 profile node_modules 解析（S3 坑 3），本包
#      dependencies 实装 @dsh-trading/connector-binance 与 @dsh-trading/kit-crypto，
#      保证 preset 行可解析、不 broken；
#   3. agent-presets root 行归 base 层所有（~/.dsh-trading-presets），本层不得重复配置。
#
# 注意：patch 文件必须保持「顶层 YAML 数组」形状（loadProfile → parsePatchList 对非数组
# 直接抛错）；只允许 insert（按 id 打已存在行 = 整行替换，多市场并存会互相覆盖）。
- insert:
    - id: dsh-trading-crypto-installer
      name: '@dsh-trading/crypto'

    # host 面数据行（2026-08-30 GUI 行情桥配套）：只 provide tradingCryptoMarketData，
    # 不注册工具（工具面留在 preset 平面）。binance/okx 两行并存、enabled 均 true，
    # 与 preset 行同形态，激活由 settings 路由裁决（router consult）。
    - id: dsh-trading-crypto-dataplane-binance
      name: '@dsh-trading/connector-binance/dataplane'
      config:
        enabled: true
    - id: dsh-trading-crypto-dataplane-okx
      name: '@dsh-trading/connector-okx/dataplane'
      config:
        enabled: true
        env: demo
    - id: dsh-trading-crypto-dataplane-bybit
      name: '@dsh-trading/connector-bybit/dataplane'
      config:
        enabled: true
    - id: dsh-trading-crypto-dataplane-ccxt
      name: '@dsh-trading/connector-ccxt/dataplane'
      config:
        enabled: true


