# crypto-trader agent preset —— dsh-trading crypto 切片（S3 机制）。
#
# 2026-08-29 设置驱动单预设重构（docs/exchange-routing.md）：本预设是 crypto 市场
# **唯一**预设——Binance 与 OKX 连接器行并存（enabled 都 true），谁激活由用户设置
# 决定（dshtrading.markets.crypto.provider，默认 binance；改 ~/.dsh/settings.yaml 后
# 新建会话生效）。连接器 apply 时 consult tradingMarketRouter 服务，与设置不符的
# 行静默退出；无需配置互斥（路由即裁决）。本文件不再有"改 enabled 切交易所"的手工步骤。
#
# 本文件由 @dsh-trading/crypto 的 dsh-trading-crypto-installer 插件（bundle host 面
# 常驻行）在 apply() 时幂等自安装到市场自有 preset root
# （默认 ~/.dsh-trading-presets/crypto-trader；agent-presets 行需把该 root 配进 roots，
# 统一配置归 @dsh-trading/base）。插件卸载不删除已安装目录；升级/重装后再次 apply 即
# 恢复一致，行不可解析时只会得到带原因的 broken 行，无进程崩溃（S3 REPORT broken 语义）。
#
# 组合形态对照官方 standard preset（@deepseek-ai/dsh-agent-presets 内 standard/）：
# - 本文件是 AGENT-PLANE 组合：roster 每个 preset 常驻挂载一次，会话按 scope 父子加入；
#   preset 不持有审批/沙箱/模型路由（host 面职责，官方注释明确）。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是一名严谨的加密货币交易员，由 {{model}} 模型驱动，工作目录为 {{cwd}}。基于当前激活的
      交易所数据（默认 Binance；设置 dshtrading.markets.crypto.provider=okx 后为 OKX，
      OKX 默认打模拟盘 demo，env=live 才是真钱）的 ticker、资金费率等做客观、量化的分析；
      下单类操作一律默认 dry-run 模拟，liveTrading 关闭时直接拒绝实盘，未经用户明确确认
      绝不触碰真实资金；涉及杠杆、仓位与资金费率时逐项核对 crypto-risk-checklist 风控清单，
      并明确提示强平与费率风险；你给出的任何内容都不构成投资建议。

# connector 行 provide 服务（tradingCryptoMarketData），按官方 standard preset 的硬性规则
# 必须包进 cordis:group + isolate（entry-local realm）：否则服务发布进 root realm，
# 与其他 preset 冲突，dsh-agent-presets 挂载时直接拒绝。（2026-08-29 主 agent 评审修复）
# 两连接器行并存、enabled 都 true——互斥由 settings 路由裁决（见头注），无需手工配置。
- id: dsh-trading-crypto-connector
  name: cordis:group
  group: true
  isolate:
    tradingCryptoMarketData: true
  config:
    - id: dsh-trading-crypto-connector-binance
      name: '@dsh-trading/connector-binance'
      config:
        enabled: true
        dryRun: true
        liveTrading: false

- id: dsh-trading-crypto-connector-okx-group
  name: cordis:group
  group: true
  isolate:
    tradingCryptoMarketData: true
    tradingCryptoTrade: true
  config:
    - id: dsh-trading-crypto-connector-okx
      name: '@dsh-trading/connector-okx'
      config:
        enabled: true
        env: demo
        dryRun: true
        liveTrading: false

- id: dsh-trading-crypto-connector-bybit-group
  name: cordis:group
  group: true
  isolate:
    tradingCryptoMarketData: true
    tradingCryptoTrade: true
  config:
    - id: dsh-trading-crypto-connector-bybit
      name: '@dsh-trading/connector-bybit'
      config:
        enabled: true
        dryRun: true
        liveTrading: false

- id: dsh-trading-crypto-connector-ccxt-group
  name: cordis:group
  group: true
  isolate:
    tradingCryptoMarketData: true
    tradingCryptoTrade: true
  config:
    - id: dsh-trading-crypto-connector-ccxt
      name: '@dsh-trading/connector-ccxt'
      config:
        enabled: true
        dryRun: true
        liveTrading: false


- id: dsh-trading-crypto-kit
  name: '@dsh-trading/kit-crypto'
  config:
    dryRun: true
    liveTrading: false

