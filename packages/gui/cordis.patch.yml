# @dshtrading/gui —— GUI 平面 bundle 的 patch 层（insert-only，README 设计铁律 #1）。
#
# 平面划分（design/bot-and-auto-trading.md §10「按包边界切，不按市场切」）：
#   host 平面（bot 与 GUI 都装）= @dshtrading/base；
#   GUI 平面（只有 GUI 装）= 本包；bot API 平面 = @dshtrading/bot-api（随后落地）。
#
# 2026-10-01 P1 拆包：本层的 11 行**原样从 @dshtrading/base 搬来**——行 id 与 name
# 一字不改（行 id 是跨版本公共契约，见 scripts/patch-id-freeze.json），只换了拥有者。
# 为什么这些行归 GUI 平面：它们都是浏览器半（语言包/设置面/中栏视图/更新对话框）或
# 只有 web 宿主才有意义的双半行（IM——host 半硬 inject connection，headless 下
# 必然 pending，靠 disabled: !!js 条件禁用兜底）。
# bot 安装闭包不得出现任何 @dshtrading/client-ui-*（P1 步骤 4 的判据）。
#
# 注意：patch 文件必须保持「顶层 YAML 数组」形状（loadProfile → parsePatchList 对非数组
# 直接抛错）；只允许 insert（按 id 打已存在行 = 整行替换，多 bundle 并存会互相覆盖）。
- insert:
    # 交易设置一级菜单（2026-08-29 浏览器半包，docs/exchange-routing.md §6）：
    # dsh.client 双面包（node 半空 apply + 浏览器半注册 settings.section id=trading）。
    # 浏览器侧由 web 宿主的 dsh-client-modules 扫描 loader entries 进 __DSH_BOOT__；
    # headless 宿主无 modules 行，此包被解析为普通 host 行（空 apply 无害）。
    - id: dsh-trading-client-ui-settings
      name: '@dshtrading/client-ui-settings'
    # 中心化 i18n 语言包（feat/i18n-zh-cn）：注册「简体中文」(zh-CN) 进宿主
    # Settings → General 语言目录，并为全部 dshtrading.* 命名空间注册 zh-CN
    # 词典（构建期 import 各 UI 包 locales.ts 纯数据模块，zh-CN ≡ zh 零漂移）。
    # 纯浏览器半语言包（dsh-web dsh-i18n 范式），headless 宿主空 apply 无害。
    # 包名解析依赖本包 dependencies 里的 @dshtrading/dsh-i18n（进 profile 安装
    # 闭包，S3 坑 3 同款；缺行 = npm 新装 profile 启动即 ERR_MODULE_NOT_FOUND，
    # issue #60 实测）。
    - id: dsh-trading-dsh-i18n
      name: '@dshtrading/dsh-i18n'
    # 交易 GUI 壳（第二阶段富途式三栏，2026-08-30）：左栏市场/自选遮蔽
    # sidebar.workspaces、中栏 conversation.view 加行情 tab、右栏 shell.overlay
    # 会话面板；node 半注册 /dshtrading/api 行情桥（web 宿主，headless 挂起无害）。
    - id: dsh-trading-client-ui-trading
      name: '@dshtrading/client-ui-trading'
    # 预置指标提供插件（2026-08-30 指标插件化）：client 半 provide
    # tradingIndicators 服务（IndicatorRegistry，预置 MA/EMA/BOLL/MACD/RSI/KDJ）；
    # 社区/自定义指标插件 inject 该服务 register definition 即可上榜。
    # headless 宿主解析为空 apply host 行，无害。
    - id: dsh-trading-client-ui-indicators
      name: '@dshtrading/client-ui-indicators'
    # 社区指标插件路径示例（indicator-supertrend，2026-08-30 指标插件化 SPIKE）：
    # client 半 inject tradingIndicators 服务并 register Supertrend（超级趋势）
    # 定义，演示第三方指标如何经服务通道上榜。本包没有自己的 cordis.patch.yml，
    # 按社区插件路径由本行挂载（node 半空 apply，headless 宿主解析为空 apply
    # host 行，无害）。包名解析依赖本包 dependencies 里的
    # @dshtrading/indicator-supertrend（进 profile 安装闭包，S3 坑 3 同款；缺行 =
    # 新装 profile 启动即 ERR_MODULE_NOT_FOUND，issue #60 实测）。
    - id: dsh-trading-indicator-supertrend
      name: '@dshtrading/indicator-supertrend'
    # 策略中栏视图（issue #34 / P5 拆包）：client 半 inject tradingStageViews
    # 注册「策略」tab + tool.call.toolview 富卡片（strategy_backtest/author）；
    # 引擎经 @dshtrading/strategies 纯库 import，桥走 shell 的 tradingBridge
    # 服务。headless 宿主解析为空 apply host 行，无害。
    - id: dsh-trading-client-ui-strategies
      name: '@dshtrading/client-ui-strategies'
    # 知识库中栏视图（issue #34 / P5 拆包）：client 半 inject tradingStageViews
    # 注册「知识库」tab；force-graph 力导图谱随本包打包（shell 已卸下该依赖）。
    # headless 宿主解析为空 apply host 行，无害。
    - id: dsh-trading-client-ui-knowledge
      name: '@dshtrading/client-ui-knowledge'
    # 大师金句活动词语言包（2026-09-05）：client 半注册「中文 · 大师金句」
    # （zh-masters，fallback zh）语言目录项 + 覆盖宿主 chat.deepDiving 单键
    # （输入框上方轮次状态行「深度求索中...」）为利弗莫尔/巴菲特/索罗斯等
    # 金句并定时轮换；(ns, locale) 单一占主语义下的语言包补位范式
    # （dsh-trading-dsh-i18n 同款）。headless 宿主解析为空 apply host 行，无害。
    - id: dsh-trading-client-ui-masters-quotes
      name: '@dshtrading/client-ui-masters-quotes'
    # 自动更新插件（2026-09-04）：软件更新对话框（client-ui-updater 浏览器半
    # 注册 shell.overlay；入口在 client-ui-trading 左栏底栏设置按钮旁）+ node 半
    # /dshtrading/api/updater 桥（GitHub Releases 检测 +
    # @dshtrading/* 家族增量更新）。node 半依赖 webServer/connection（headless
    # 挂起无害）；增量通道只作用于桌面版 seeded profile（.dsh-desktop-seed.json
    # 标记），dev/headless profile 降级为发布页链接。包名解析依赖本包
    # dependencies 里的 @dshtrading/client-ui-updater（进 profile 安装闭包，
    # S3 坑 3 同款）。
    - id: dsh-trading-client-ui-updater
      name: '@dshtrading/client-ui-updater'

    # 会话归纳 / 使用统计（@linxin666/dsh-session-archive、@linxin666/dsh-usage）
    # 2026-09-23 随 0.1.7 cohort 移除：二者客户端半硬注入已删的 ctx.settingsScope
    # （0.1.7 改为 configForms），在 0.1.7 下永久 pending、UI 静默消失；官方 0.1.7
    # 已原生提供会话归档/置顶管理与「性能与用量」设置。详见
    # .agents/notes/implemented/feature/2026-09-08-npm-embed-usage-plugin-manager-model-capabilities.md。
    # IM 机器人接入（2026-09-06，npm 复用社区插件 @xmanrui/dsh-im）：飞书/微信/
    # 钉钉/企业微信/QQ/Slack/Telegram/Discord/WhatsApp 九渠道机器人接入，
    # 单行双半：host 半（渠道连接/流式回复，凭据只进宿主受保护凭据存储）+
    # 浏览器半（设置 → IM机器人 配置面，section order 21，与 updater 的
    # order 20 相邻不冲突）。市场无关共享行，归 base 所有（铁律 #1）。
    # 凭据须用户在设置面板显式配置，未配置时各渠道空闲待命，insert 不改变
    # 交易会话数据安全面。包名解析依赖本包 dependencies 里的
    # @xmanrui/dsh-im（进 profile 安装闭包，S3 坑 3 同款）。版本由 base 的
    # package.json 与工作区 lockfile 统一管理，升级后需刷新用户 profile。
    # 注意：本行即内置安装，勿再对 profile 执行 `dsh plugin add
    # @xmanrui/dsh-im`——其自带 patch（id xmanrui-dsh-im）会与本行重复
    # 挂载同一插件，设置面二次注册。
    # 行安全（issue #88）：host 半硬 inject connection/credentials/typertGateway，
    # headless 宿主缺 connection 即永久 pending → 启动即崩；按提供方行条件禁用
    # （见文件头「条件禁用行」）。
    - id: dsh-trading-im
      name: '@xmanrui/dsh-im'
      disabled: !!js (![...loader.entries()].some((entry) => entry.options.name === '@deepseek-ai/dsh-client-connection'))
