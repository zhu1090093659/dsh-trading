# @dshtrading/bot —— bot 平面 bundle 的 patch 层（insert-only，README 设计铁律 #1）。
#
# 为什么现在是空的 `[]`（**有意保持为空**，同 @dshtrading/all 的先例）：
#   patch 文件必须保持「顶层 YAML 数组」形状——loadProfile → parsePatchList 对非数组
#   直接抛错，空层必须写字面量 `[]` 而不是只有注释（否则启动即失败）。
#   本包在 P1 只承担「平面归属」：让 bot profile 的安装闭包与 GUI profile 的闭包在
#   依赖图上就分开（pnpm plane:check 按它量 bot 平面）。
#
# P2 在此追加（届时行 id 必须经 node scripts/patch-id-gate.mjs --update 显式登记）：
#   1. bot-startup provider 行——bot surface 的启动装配（profile 声明 + 失败诊断）；
#   2. 传输行——执行核 UDS 客户端（只连 Unix domain socket，不监听任何网络接口）。
# 两者都不得引入 webserver / connection / modules 行（§2.2「不踩 web 栈」）。
