# @dshtrading/bot —— bot 平面 bundle 的 patch 层（insert-only，README 设计铁律 #1）。
#
# 本层只放 bot surface 自己的两行，**不引**官方 webserver / connection / modules：
# 那三行进全局必需集，任一失败会让整个 app dispose 退出，而 bot 面要能在没有任何
# 浏览器客户端时照常跑（卡片 §2.2「不踩 web 栈」）。行 id 走 dsh-trading-* 命名空间。
#
# 顺序有意义：startup 行提供 botStartup 服务，http 行 inject 它——Loader 只在服务
# 存在后才解析后者，所以 --help 既不绑端口也不报错。
- insert:
    - id: dsh-trading-bot-startup
      name: '@dshtrading/bot/startup'

    - id: dsh-trading-bot-http
      name: '@dshtrading/bot/http'
      inject: [botStartup]
