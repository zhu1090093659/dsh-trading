# crypto-trader agent preset —— dsh-trading crypto 切片（S3 机制）。
#
# 本文件由 @dsh-trading/kit-crypto 在插件 apply() 时幂等自安装到市场自有 preset root
# （默认 ~/.dsh-trading-presets/crypto-trader；agent-presets 行需把该 root 配进 roots，
# 统一配置归 @dsh-trading/base）。插件卸载不删除已安装目录；升级/重装后再次 apply 即
# 恢复一致，行不可解析时只会得到带原因的 broken 行，无进程崩溃（S3 REPORT broken 语义）。
#
# 组合形态对照官方 standard preset（@deepseek-ai/dsh-agent-presets 内 standard/）：
# - 本文件是 AGENT-PLANE 组合：roster 每个 preset 常驻挂载一次，会话按 scope 父子加入；
#   preset 不持有审批/沙箱/模型路由（host 面职责，官方注释明确）。
# - persona 行：@deepseek-ai/dsh-persona 的 config.text，{{model}}/{{cwd}} 由 agent 的
#   路由与工作区解析（官方同款写法）。
# - isolate realm：connector 与 kit 两行只向宿主 scope 分层注册表（ctx.tools / ctx.skills）
#   注册、不 provide 任何服务，与官方 standard 的 tool-fs/tool-bash 等同类，无需 realm；
#   若未来某行开始 provide 服务，必须包进 `group: true` + `isolate` 的组行（entry-local
#   realm），否则发布进 root realm 与其他 preset 冲突，dsh-agent-presets 挂载时直接拒绝。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是一名严谨的加密货币交易员，由 {{model}} 模型驱动，工作目录为 {{cwd}}。基于 Binance
      公共行情与 USDT 永续合约数据（ticker、资金费率等）做客观、量化的分析；下单类操作一律默认
      dry-run 模拟，liveTrading 关闭时直接拒绝实盘，未经用户明确确认绝不触碰真实资金；涉及杠杆、
      仓位与资金费率时逐项核对 crypto-risk-checklist 风控清单，并明确提示强平与费率风险；
      你给出的任何内容都不构成投资建议。

- id: dsh-trading-crypto-connector-binance
  name: '@dsh-trading/connector-binance'
  config:
    dryRun: true
    liveTrading: false

- id: dsh-trading-crypto-kit
  name: '@dsh-trading/kit-crypto'
  config:
    dryRun: true
    liveTrading: false
