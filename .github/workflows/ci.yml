name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同一 ref 的新推送取消仍在跑的旧跑：此前连推三次会让三份全矩阵排队，
# 反馈落到最后一个提交上。取消进行中的旧跑是把反馈绑到最新提交的最便宜手段。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态门禁（Tier 1 快层）：平台无关，单点跑一次。放在独立 job 是为了让
  # lint/类型/规范类失败在 3 个 OS 矩阵之前就有结论，不烧矩阵资源。
  static-gates:
    name: Static gates (typecheck / i18n / test hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # 版本读 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # SDK（@deepseek-ai/*）由 npm 官方源解析，cohort 版本由 lockfile + pnpm-workspace.yaml 的
      # minimumReleaseAgeExclude 钉定；不再克隆/构建 DSH 源码 checkout 或重定向 overrides。
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # 棘轮门禁（PR #46 实证：tsdown/esbuild build 不做类型检查）：tsc --noEmit
      # 错误数不得超过 scripts/typecheck-baseline.json 基线，只许降不许升。
      # 依赖 build 先产出 lib/*.d.ts，否则 TS2307 噪音会让计数漂移。
      - run: node scripts/typecheck-gate.mjs
      # i18n 门禁（PR #56 评审 H2）：zh/en 键位对齐 + {placeholder} 对齐 +
      # client CJK 扫描 + dsh-i18n 中心包漂移。读各包 lib 产物，必须在 build 后。
      - run: pnpm i18n:check
      # 行 id 门禁：dsh-trading-* 是比 HTTP 路径更硬的跨版本公共契约——同一 id 被两层
      # insert 时宿主 loader 会静默塌缩为最后一条（不抛错），只能靠启动前的静态门禁拦。
      # 判据文件 scripts/patch-id-freeze.json（新增/改名必须显式 --update）。
      - run: pnpm patch-id:check
      # 数据面入口结构门禁：每个 dataplane 入口必须重导出主行 Config schema——宿主 loader
      # 只认被加载模块自己导出的 Config 补行 config 默认值，缺它时 schema 默认值全丢
      # （2026-10-14 的 17 个入口就是如此，qmt/alpaca 因此整行未激活）。
      - run: pnpm connector-dataplane:check
      # 工具契约门禁（tools-and-mcp / issue #43cedfae）：工具名、必填参数、参数类型
      # 与输出形状是模型可见的公共契约；此前只有打印报告、无基线断言。
      # 判据文件 scripts/tool-contract-freeze.json（新增/改名必须显式 --update）。
      - run: pnpm tool-contract:check
      # 实盘下单不变量：已挂载且真能下单的连接器必须声明 intentId（幂等键）
      # 与 dryRun（显式模拟出口）；未实现实盘分支的桩连接器不计入。
      - run: pnpm live-order:check
      # 实盘开关门禁：不变量 §13.3「实盘开关不在 agent 可写路径上」——preset 资产里的
      # liveTrading 只是非权威镜像（只许 false），实盘授权由 @dshtrading/authority 的
      # 人工签署平面裁定；运行期不得引用签署侧。
      - run: pnpm live-trading:check
      # 平面闭包门禁（plane:check）与 bot 安装闭包验收（bot-closure:check）已随自动交易
      # 平面迁往私有卫星仓 dsh-trading-bot：它们判据的对象是 bot/GUI 平面的包集合，
      # 主仓不再含 bot 实现，留在主仓只会变成永假的断言。
      # 测试卫生棘轮（business-testing-ci §6）：BDD 命名/结构、零 mock、零 sleep、
      # 断言完整性；存量债入 scripts/test-audit-baseline.json，只许降不许升。
      - run: pnpm test:audit
      # scripts/ 下的门禁自测（i18n-audit 11 例等）。此前只被 root pnpm test 扫到，
      # 而 CI 用的是 pnpm -r test（只跑 workspace 包），这批测试实际从未在 CI 运行过。
      - run: pnpm test:scripts
      # desktop/ 是独立 npm 工程（不在 pnpm workspace），pnpm -r test 覆盖不到它，
      # 其 21 个 node:test 用例（runtime payload 解包、host 符号规范化）此前从未进 CI。
      - run: pnpm test:desktop
      # iOS 证据跑批门禁（test:ios-evidence）已随 apps/ios-native 迁往私有卫星仓。
      # id 冻结面门禁（contract-id:check）已随 packages/contract 迁往私有卫星仓。
      # iOS 原生观测端的三条纯 Node 门禁（check-contract-drift / check-swift-layering /
      # check-transport-token-binding）已随 apps/ios-native 迁往私有卫星仓，在那边与 Swift
      # 源码同仓演进（它们比对的 packages/contract 真值也在那个仓里）。
      # 端到端冒烟（e2e:smoke）已随自动交易平面迁往私有卫星仓 dsh-trading-bot：
      # 它跑的 drill（shadow-run / desk-loop / v1-client-flow 等）全在 packages/tradectl。
      # home 守卫门禁：读 DSH_HOME 的脚本必须带「拒绝继承宿主 home」的守卫。
      # 存在理由：2026-10-01 一天内在四处发现同一缺陷（脚本拿继承的宿主 home 起实例、
      # 写宿主数据、对着宿主 home 做预检），而它们**都不报错**——脚本照常成功，只是作用在
      # 另一个实例的数据上。四个补丁挡不住第五个脚本，所以把策略写成门禁。
      - run: pnpm home-guard:check
      # CI 接线门禁（双向）：① workflow 里引用的 pnpm 脚本与 node 脚本必须存在（按步骤的
      # working-directory 解析）；② 一份"必须接线"的门禁清单必须真的出现在 CI 或 gates:all 里
      # ——后者堵的是"门禁建好了却没接线、与散文无异"这一类漂移（本仓已实证四次）。
      # 不进 CI 的门禁必须写明原因（如 ui:check 需 headless Chrome 真起实例）。
      - run: pnpm ci-wiring:check
      # 文档相对链接门禁：断链不报错、只让后人找不到那份 Owning Note。存量 18 条入基线
      # （scripts/docs-link-baseline.json，按**仓库根相对**路径记账，与 checkout 位置无关），
      # **只拦新增** —— 一上线就红的门禁等于没有门禁。
      - run: pnpm docs-link:check

  # 测试矩阵（Tier 1 主体）：与发版管线同源（install+build+test）。
  test:
    name: Test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          # Windows 信号前移（2026-09-06）：此前 Windows 只在 desktop-release
          # tag 管线被测，v0.1.2/v0.1.4 两次都在发版当天才暴露 Windows 专属
          # 故障（chmod 语义、CRLF 检出等）。本 entry 与发版管线同源
          # （install+build+test）。静态门禁已在 static-gates 单点覆盖，不在此重复。
          - os: windows-latest
            node: '22'   # 与 desktop-release 管线一致

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

  # mygo 桌面壳（Go 门禁）：desktop/mygo 是独立 Go 模块（不在 pnpm workspace），
  # static-gates 与三 OS 矩阵只覆盖 node/pnpm，这个模块此前没有任何 CI 覆盖——
  # 它的格式、vet、用例与两个交付平台的编译都只在有人手动跑过的机器上验证过。
  # 与既有 job 之间没有 needs：Go 门禁与 node 矩阵是互为独立的结论，一方红不该
  # 遮住另一方，既有 job 的名称、语义与触发条件都不因此改变。
  mygo-shell:
    name: Mygo shell (gofmt / vet / test / cross-build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # go.mod 的 go 指令（1.27.3）就是最小工具链。关掉自动下载，让 setup-go 钉的
      # 版本与 go.mod 漂移时当场红在版本上，而不是被 go 悄悄换个工具链跑绿。
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      # 版本与 desktop/mygo/go.mod 的 `go 1.27.3` 逐字对齐，不用 'stable'/'1.x'
      # 这类浮动标签：模块抬最小工具链时必须同 PR 改这里，漂移要在 CI 上可见。
      # 缓存走 setup-go 自带模块缓存，key 取模块自己的 go.sum（仓库根没有 go.sum）。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: desktop/mygo/go.sum

      # gofmt 门禁：gofmt -l 对未格式化文件同样返回 0，所以判据是"零输出"而不是
      # 退出码；有输出即红，并把文件清单打出来，不静默红。
      - name: gofmt
        working-directory: desktop/mygo
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo '::error::gofmt found unformatted files:'
            echo "$unformatted"
            exit 1
          fi

      # vet 与 test 都用 runner 自身的 GOOS/GOARCH（linux/amd64）；跨平台编译另立两步。
      - name: go vet
        working-directory: desktop/mygo
        run: go vet ./...

      - name: go test
        working-directory: desktop/mygo
        run: go test ./...

      # 交叉编译门禁：两个交付平台必须编得过（只 build，不打包）。不跑 `mygo build`、
      # 不下载 mygo CLI——产物格式、打包与签名属于 desktop-release 管线（另一张卡），
      # 这个 job 只负责"同一份源码在两个目标平台都编得出"这一件事。
      - name: Cross-build (darwin/arm64)
        working-directory: desktop/mygo
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: go build ./...

      - name: Cross-build (linux/amd64)
        working-directory: desktop/mygo
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build ./...
