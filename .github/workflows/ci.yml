name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']   # engines: ^22.19.0 || >=24.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # 版本读 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # SDK（@deepseek-ai/* 0.1.2-alpha.2）由 npm 官方源解析，lockfile 已含全部
      # 解析；不再克隆/构建 DSH 源码 checkout 或重定向 overrides（2026-08-30 切 npm 世代）。
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
