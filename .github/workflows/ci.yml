name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']   # engines: ^22.19.0 || >=24.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # 版本读 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # SDK（@deepseek-ai/* 0.1.2-alpha.2）由 npm 官方源解析，lockfile 已含全部
      # 解析；不再克隆/构建 DSH 源码 checkout 或重定向 overrides（2026-08-30 切 npm 世代）。
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # 棘轮门禁（PR #46 实证：tsdown/esbuild build 不做类型检查）：tsc --noEmit
      # 错误数不得超过 scripts/typecheck-baseline.json 基线，只许降不许升。
      # 依赖 build 先产出 lib/*.d.ts，否则 TS2307 噪音会让计数漂移。
      - run: node scripts/typecheck-gate.mjs
      # i18n 门禁（PR #56 评审 H2）：zh/en 键位对齐 + {placeholder} 对齐 +
      # client CJK 扫描 + dsh-i18n 中心包漂移。读各包 lib 产物，必须在 build 后。
      - run: pnpm i18n:check
      - run: pnpm -r test
