name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同一 ref 的新推送取消仍在跑的旧跑：此前连推三次会让三份全矩阵排队，
# 反馈落到最后一个提交上。取消进行中的旧跑是把反馈绑到最新提交的最便宜手段。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 静态门禁（Tier 1 快层）：平台无关，单点跑一次。放在独立 job 是为了让
  # lint/类型/规范类失败在 3 个 OS 矩阵之前就有结论，不烧矩阵资源。
  static-gates:
    name: Static gates (typecheck / i18n / test hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # 版本读 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # SDK（@deepseek-ai/*）由 npm 官方源解析，cohort 版本由 lockfile + pnpm-workspace.yaml 的
      # minimumReleaseAgeExclude 钉定；不再克隆/构建 DSH 源码 checkout 或重定向 overrides。
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # 棘轮门禁（PR #46 实证：tsdown/esbuild build 不做类型检查）：tsc --noEmit
      # 错误数不得超过 scripts/typecheck-baseline.json 基线，只许降不许升。
      # 依赖 build 先产出 lib/*.d.ts，否则 TS2307 噪音会让计数漂移。
      - run: node scripts/typecheck-gate.mjs
      # i18n 门禁（PR #56 评审 H2）：zh/en 键位对齐 + {placeholder} 对齐 +
      # client CJK 扫描 + dsh-i18n 中心包漂移。读各包 lib 产物，必须在 build 后。
      - run: pnpm i18n:check
      # 行 id 门禁：dsh-trading-* 是比 HTTP 路径更硬的跨版本公共契约——同一 id 被两层
      # insert 时宿主 loader 会静默塌缩为最后一条（不抛错），只能靠启动前的静态门禁拦。
      # 判据文件 scripts/patch-id-freeze.json（新增/改名必须显式 --update）。
      - run: pnpm patch-id:check
      # 实盘开关门禁：不变量 §13.3「实盘开关不在 agent 可写路径上」——preset 资产里的
      # liveTrading 只是非权威镜像（只许 false），实盘授权由 @dshtrading/authority 的
      # 人工签署平面裁定；运行期不得引用签署侧。
      - run: pnpm live-trading:check
      # 测试卫生棘轮（business-testing-ci §6）：BDD 命名/结构、零 mock、零 sleep、
      # 断言完整性；存量债入 scripts/test-audit-baseline.json，只许降不许升。
      - run: pnpm test:audit
      # scripts/ 下的门禁自测（i18n-audit 11 例等）。此前只被 root pnpm test 扫到，
      # 而 CI 用的是 pnpm -r test（只跑 workspace 包），这批测试实际从未在 CI 运行过。
      - run: pnpm test:scripts
      # desktop/ 是独立 npm 工程（不在 pnpm workspace），pnpm -r test 覆盖不到它，
      # 其 21 个 node:test 用例（runtime payload 解包、host 符号规范化）此前从未进 CI。
      - run: pnpm test:desktop

  # 测试矩阵（Tier 1 主体）：与发版管线同源（install+build+test）。
  test:
    name: Test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          # Windows 信号前移（2026-09-06）：此前 Windows 只在 desktop-release
          # tag 管线被测，v0.1.2/v0.1.4 两次都在发版当天才暴露 Windows 专属
          # 故障（chmod 语义、CRLF 检出等）。本 entry 与发版管线同源
          # （install+build+test）。静态门禁已在 static-gates 单点覆盖，不在此重复。
          - os: windows-latest
            node: '22'   # 与 desktop-release 管线一致

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
