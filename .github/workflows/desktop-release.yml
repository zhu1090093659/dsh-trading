name: desktop-release

# 发版开关：推送 vX.Y.Z tag 即触发（唯一发布开关，tag 即版本事实源）。
#
# 管线做四件事：
# 1. 硬校验 @dshtrading/* 全家族 package.json 版本与 tag 一致——桌面安装包把
#    workspace 包以 packed tarball 内嵌分发，版本不一致会发出"包内版本与
#    Release 版本互相矛盾"的安装包，必须先修复版本再推 tag；
# 2. 在 macOS（dmg+zip，arm64/x64）与 Windows（nsis+zip，x64）runner 上打包
#    桌面版（Electron + electron-builder，按 electron-builder.yml 保持未签名）；
# 3. 发布 @dshtrading/* 全家族到 npm（NPM_TOKEN secret；NPM_PUBLISH_ENABLED
#    可整体关闭 npm 通道，关闭时 tag 推送退回仅桌面发布）；
# 4. npm 与桌面两路都成功后，创建 GitHub Release 并附着全部安装包与
#    SHA256SUMS.txt（任一路失败不创建 Release，保持发版 all-or-nothing）。
#
# npm 通道幂等：已存在于 registry 的精确版本（name@version）跳过不重发，
# 因此删除 tag 重推修 CI 是安全的；但同版本号换代码重推被禁止——任何包内容
# 变更必须走版本 bump（npm 版本不可变）。
# 失败恢复：部分包已上 registry 时不要重推同一 tag 的"全部重发"幻想，脚本
# 会自动跳过已发布包继续；发现坏包走 deprecate + 下一补丁版本。
#
# 决策记录：.agents/notes/implemented/process/2026-09-03-desktop-release-pipeline.md
# 发版操作手册：.dsh/skills/dsh-trading-release/SKILL.md

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # npm 发布通道开关（2026-09-03 用户授权发布 @dshtrading/*）。置 'false' 时
  # tag 推送只做桌面发布，不触碰 npm。决策记录见 .agents/notes/ 对应 note。
  NPM_PUBLISH_ENABLED: 'true'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Verify @dshtrading/* versions match the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check family versions against tag
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: node scripts/verify-release-version.mjs

  npm-publish:
    name: Publish @dshtrading/* to npm
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      # 与 build-desktop 同源的发布门禁：npm 产物同样必须全绿
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

      # 幂等发布：registry 已存在的精确版本跳过（见脚本头注释）
      - name: Publish packages (skip versions already on the registry)
        if: env.NPM_PUBLISH_ENABLED == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm.mjs

  build-desktop:
    name: Build desktop app (${{ matrix.os }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder-args: --mac dmg zip --arm64 --x64
            artifact: desktop-mac
            electron-cache-path: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - os: windows-latest
            builder-args: --win nsis zip --x64
            artifact: desktop-win
            electron-cache-path: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # 版本读根 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 发布门禁：与 ci.yml 同源的构建 + 测试，全绿才允许打包
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm -r build
      - name: Test workspace
        run: pnpm -r test

      - name: Cache Electron / electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ${{ matrix.electron-cache-path }}
          key: electron-${{ matrix.os }}-${{ hashFiles('desktop/package-lock.json') }}

      # desktop/ 是独立 npm 工程（不在 pnpm workspace），用自身 lockfile 安装
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # 拉取各平台 Node 发行版并把 workspace 包打包成 runtime payload
      # （build-runtime.mjs 内部会再次执行 pnpm -r build，幂等）
      - name: Stage desktop runtime payload
        working-directory: desktop
        run: npm run prepare-runtime

      # 安装包版本以 tag 为准（desktop/package.json 不参与 changesets fixed 组）
      - name: Set desktop version from tag
        env:
          DESKTOP_VERSION: ${{ github.ref_name }}
        run: node scripts/set-desktop-version.mjs

      - name: Package desktop app
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder-args }}

      # 增量更新通道：把 vendor tarballs 展开打包成 trading-update-<tag>.zip +
      # updates-manifest-<tag>.json（trust anchor：payload sha256/bytes + 包清单），
      # 由 GitHub Release 步骤一并发布；updater 插件按 manifest 校验后做逐包 swap。
      # 双平台跑一次即可——payload 是纯 JS 包内容，与安装包架构无关；仅 macOS 跑，
      # Windows 跳过（避免重复资产与 SHA256SUMS 竞争）。
      - name: Pack incremental update payload
        if: matrix.artifact == 'desktop-mac'
        env:
          UPDATE_TAG: ${{ github.ref_name }}
        run: node scripts/pack-update-payload.mjs

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/updates-manifest-*.json
          if-no-files-found: error

  github-release:
    name: Create GitHub Release with desktop artifacts
    needs: [npm-publish, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # gh release create 需要仓库上下文（确定 repo、生成 notes），必须先 checkout
      - uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt

      # notes = 固定安装提示前缀（.github/release-preamble.md）+ 自动生成段落；
      # gh 不允许 --notes-file 与 --generate-notes 同用，因此先调 API 生成再拼接
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > "$RUNNER_TEMP/generated.md"
          cat .github/release-preamble.md "$RUNNER_TEMP/generated.md" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --title "dsh-trading $GITHUB_REF_NAME"
