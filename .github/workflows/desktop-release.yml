name: desktop-release

# 发版开关：推送 vX.Y.Z tag 即触发（唯一发布开关，tag 即版本事实源）。
#
# 管线做五件事：
# 1. 硬校验 @dshtrading/* 全家族 package.json 版本与 tag 一致——桌面安装包把
#    workspace 包以 packed tarball 内嵌分发，版本不一致会发出"包内版本与
#    Release 版本互相矛盾"的安装包，必须先修复版本再推 tag；
# 2. 在 macOS（dmg+zip，arm64/x64）与 Windows（nsis+zip，x64）runner 上打包
#    桌面版（Electron + electron-builder，按 electron-builder.yml 保持未签名）；
#    安装包内嵌完整工具链（node + npm + pnpm 的官方 Node 发行版、dsh host
#    闭包、预装 trading-web profile），零编程环境的机器开箱即用，打包前有
#    工具链完整性闸门（verify-runtime-toolchain）；
# 3. 在 macOS runner 上打包 mygo 壳（Go + 系统 WebView，arm64）的 .app 与 .dmg，
#    与 Electron 包同批产出：载荷必须在这个 job 里现生成（CI 上没有装好的 app
#    可抄），签名与公证凭据全是可选 secret，缺省 ad-hoc 且不因此变红。两壳的
#    产物靠 job / artifact 与 bundle identifier（com.dsh-trading.desktop 对
#    com.dsh-trading.desktop.mygo）区分，不靠文件名——mygo 的 dmg 只比
#    Electron 的少一段 -mac-；
# 4. 发布 @dshtrading/* 全家族到 npm（NPM_TOKEN secret；NPM_PUBLISH_ENABLED
#    可整体关闭 npm 通道，关闭时 tag 推送退回仅桌面发布）；
# 5. npm 与两路桌面包（Electron / mygo）都成功后，创建 GitHub Release 并附着
#    全部安装包与 SHA256SUMS.txt（任一路失败不创建 Release，保持发版
#    all-or-nothing）。
#
# npm 通道幂等：已存在于 registry 的精确版本（name@version）跳过不重发，
# 因此删除 tag 重推修 CI 是安全的；但同版本号换代码重推被禁止——任何包内容
# 变更必须走版本 bump（npm 版本不可变）。
# 失败恢复：部分包已上 registry 时不要重推同一 tag 的"全部重发"幻想，脚本
# 会自动跳过已发布包继续；发现坏包走 deprecate + 下一补丁版本。
#
# 决策记录：.agents/notes/implemented/process/2026-09-03-desktop-release-pipeline.md
# 发版操作手册：.agents/skills/dsh-trading-release/SKILL.md

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # npm 发布通道开关（2026-09-03 用户授权发布 @dshtrading/*）。置 'false' 时
  # tag 推送只做桌面发布，不触碰 npm。决策记录见 .agents/notes/ 对应 note。
  NPM_PUBLISH_ENABLED: 'true'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Verify @dshtrading/* versions match the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check family versions against tag
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: node scripts/verify-release-version.mjs

  npm-publish:
    name: Publish @dshtrading/* to npm
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      # 与 build-desktop 同源的发布门禁：npm 产物同样必须全绿。
      # 2026-09-15：发布闸门从「build+test」升级为与 ci.yml static-gates 同源的
      # 全量静态门禁——类型棘轮、i18n、测试卫生、脚本站测试此前只在 PR CI 跑，
      # 直接推 tag 可以绕过它们发版；发版必须比 PR 更严，不能更松。
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node scripts/typecheck-gate.mjs
      - run: pnpm i18n:check
      - run: pnpm test:audit
      - run: pnpm test:scripts
      - run: pnpm -r test
      - run: pnpm test:desktop

      # 幂等发布：registry 已存在的精确版本跳过（见脚本头注释）
      - name: Publish packages (skip versions already on the registry)
        if: env.NPM_PUBLISH_ENABLED == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm.mjs

  build-desktop:
    name: Build desktop app (${{ matrix.os }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder-args: --mac dmg zip --arm64 --x64
            artifact: desktop-mac
            electron-cache-path: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - os: windows-latest
            builder-args: --win nsis zip --x64
            artifact: desktop-win
            electron-cache-path: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # 版本读根 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 发布门禁：与 ci.yml 同源的构建 + 测试，全绿才允许打包
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm -r build
      - name: Test workspace
        run: pnpm -r test
      # 桌面壳自身的 node:test 用例（runtime payload 解包 / host 符号规范化）
      # 此前从未进入发版管线：打包的是它们所验证的产物，必须打包前跑绿。
      - name: Test desktop payload
        run: pnpm test:desktop

      - name: Cache Electron / electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ${{ matrix.electron-cache-path }}
          key: electron-${{ matrix.os }}-${{ hashFiles('desktop/package-lock.json') }}

      # desktop/ 是独立 npm 工程（不在 pnpm workspace），用自身 lockfile 安装
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # 拉取各平台 Node 发行版、把 pnpm 装进当前平台的发行版（打包后的安装包
      # 自带 node + npm + pnpm，零编程环境的机器开箱可用），并把 workspace 包
      # 打包成 runtime payload（build-runtime.mjs 内部会再次执行 pnpm -r build，
      # 幂等）
      - name: Stage desktop runtime payload
        working-directory: desktop
        run: npm run prepare-runtime

      # 发布闸门：当前平台暂存的 Node 发行版必须自带 node/npm/npx/pnpm 且可执行
      - name: Verify bundled toolchain (node/npm/pnpm)
        working-directory: desktop
        run: node scripts/verify-runtime-toolchain.mjs

      # 安装包版本以 tag 为准（desktop/package.json 不参与 changesets fixed 组）
      - name: Set desktop version from tag
        env:
          DESKTOP_VERSION: ${{ github.ref_name }}
        run: node scripts/set-desktop-version.mjs

      - name: Package desktop app
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder-args }}

      # 增量更新通道：把 vendor tarballs 展开打包成 trading-update-<tag>.zip +
      # updates-manifest-<tag>.json（trust anchor：payload sha256/bytes + 包清单），
      # 由 GitHub Release 步骤一并发布；updater 插件按 manifest 校验后做逐包 swap。
      # 双平台跑一次即可——payload 是纯 JS 包内容，与安装包架构无关；仅 macOS 跑，
      # Windows 跳过（避免重复资产与 SHA256SUMS 竞争）。
      - name: Pack incremental update payload
        if: matrix.artifact == 'desktop-mac'
        env:
          UPDATE_TAG: ${{ github.ref_name }}
        run: node scripts/pack-update-payload.mjs

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/updates-manifest-*.json
          if-no-files-found: error

  # 双轨期第二轨：mygo 壳（Go + 系统 WebView，arm64）。Electron 轨（build-desktop）
  # 原样并存，两轨同一个 tag、同一份载荷来源、同一个 GitHub Release。
  #
  # 自给自足：CI 上没有 /Applications/DSH Trading.app 可以当载荷素材，所以载荷
  # 必须在这个 job 里现生成（fetch-node → stage-pnpm → build-runtime），再由
  # stage-mygo-payload.mjs 映射成 mygo 读的 runtime 布局。build-mygo-mac.sh 用
  # --no-payload 打包已经映射好的载荷，并在打完后自证 agent 通道在产物里。
  #
  # 不重复发布门禁已经跑过的测试：同一 commit 上的 npm-publish 与 build-desktop
  # 已经跑过 pnpm test:desktop 与全量 pnpm -r test，Release 也要三路全绿才创建；
  # 这里只做打包必需的 install/build 和 mygo 轨自己的闸门。
  #
  # 签名全走可选 secret：MYGO_SIGN_IDENTITY / APPLE_ID / APPLE_TEAM_ID /
  # APPLE_APP_SPECIFIC_PASSWORD。一个都没有时按 ad-hoc 打包，并把「这次是 ad-hoc」
  # 写进日志；缺 secret 不让流水线变红，也不新增必须配置的 secret。Developer ID
  # 身份还要求钥匙串里有对应证书，证书导入不在本 job 里。
  build-desktop-mygo:
    name: Build desktop app (mygo, macos-latest)
    needs: check-version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # go.mod 的 go 指令（1.27.3）就是最小工具链。关掉自动下载，让 setup-go 钉的
      # 版本与 go.mod 漂移时当场红在版本上（与 ci.yml 的 mygo-shell 同款）。
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4   # 版本读根 package.json 的 packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 版本与 desktop/mygo/go.mod 的 go 1.27.3 指令逐字对齐；action 与钉法照抄
      # ci.yml 的 mygo-shell（同一 actions 家族，不引入新的第三方 action）。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: desktop/mygo/go.sum

      # GOTOOLCHAIN=local 只挡「工具链太旧」；工具链比 go.mod 新时它照样绿，所以
      # 这里显式对齐一次，两个方向都红在版本上而不是红在编译错误里。
      - name: Verify the Go toolchain matches desktop/mygo/go.mod
        run: |
          want="$(awk '$1 == "go" { print $2 }' desktop/mygo/go.mod)"
          have="$(go version | awk '{ print $3 }' | sed 's/^go//')"
          echo "go.mod wants go $want; this runner has go $have"
          if [ "$want" != "$have" ]; then
            echo "::error::desktop/mygo/go.mod wants go $want but the runner has go $have"
            exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm -r build

      # 载荷现生成：CI 没有装好的 app 可以抄。fetch-redist 只服务 Windows 的
      # NSIS，mygo 轨不需要，所以不走 prepare-runtime，逐步跑三个脚本，哪一步
      # 坏了在日志里一眼可辨。
      - name: Fetch the bundled Node distributions
        working-directory: desktop
        run: node scripts/fetch-node.mjs
      - name: Stage pnpm (the packageManager pin) into each Node distribution
        working-directory: desktop
        run: node scripts/stage-pnpm.mjs
      - name: Build the runtime payload
        working-directory: desktop
        run: node scripts/build-runtime.mjs

      # 发布闸门：载荷里的 node/npm/npx/pnpm 必须真的存在且可执行
      - name: Verify bundled toolchain (node/npm/npx/pnpm)
        working-directory: desktop
        run: node scripts/verify-runtime-toolchain.mjs

      # node-<os>-<cpu>/ 映射成 mygo 读的 runtime/node/，缺件在打包前就红。
      # 映射完删掉 Electron 布局的那份载荷：这一轨只打包 mygo，而 macOS runner
      # 的磁盘要同时装下载荷副本和 1.8G 的 .app。
      - name: Stage the payload into the mygo project
        working-directory: desktop
        run: |
          node scripts/stage-mygo-payload.mjs --platform darwin-arm64
          rm -rf resources/runtime

      # 版本跟 tag 走，与 Electron 轨的 set-desktop-version.mjs 对称：mygo build
      # 只认 mygo.json，重写发生在 runner 里，仓库内容不变。
      - name: Set the mygo manifest version from the tag
        working-directory: desktop
        env:
          DESKTOP_VERSION: ${{ github.ref_name }}
        run: node scripts/set-mygo-version.mjs

      # 发布形态（MYGO_INSPECTOR=1，带 agent 通道）由脚本自己决定；这里是唯一
      # 决定签名形态的地方：有身份 secret 才传 --sign，三个公证 secret 齐了才传
      # --notarize，其余一律 ad-hoc 并把模式写进日志。
      - name: Package the mygo app and disk image
        env:
          MYGO_SIGN_IDENTITY: ${{ secrets.MYGO_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          args=(--platform darwin/arm64 --no-payload)
          if [ -n "${MYGO_SIGN_IDENTITY:-}" ]; then
            args+=(--sign "${MYGO_SIGN_IDENTITY}")
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
              args+=(--notarize)
              echo "[mygo-release] signing: Developer ID identity from MYGO_SIGN_IDENTITY, notarizing with APPLE_ID + APPLE_TEAM_ID"
            else
              echo "[mygo-release] signing: identity from MYGO_SIGN_IDENTITY; notarization skipped (APPLE_ID / APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD not all set)"
            fi
          else
            echo "[mygo-release] signing: ad-hoc (-); no MYGO_SIGN_IDENTITY secret here, so Gatekeeper will not accept this build"
          fi
          echo "[mygo-release] desktop/scripts/build-mygo-mac.sh ${args[*]}"
          desktop/scripts/build-mygo-mac.sh "${args[@]}"

      # 产物区分：dmg 进 desktop-mac-mygo（github-release 按 desktop-* 收集，
      # 与 Electron 资产共用同一份 SHA256SUMS.txt）；.app 是目录，进 dist/ 会同时
      # 打断 sha256sum 与 gh release create，所以单独命名成不以 desktop- 开头的
      # artifact，永远不进 Release 资产。
      - name: Upload the mygo disk image
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-mygo
          path: desktop/mygo/build/darwin-arm64/*.dmg
          if-no-files-found: error

      - name: Upload the mygo app bundle
        uses: actions/upload-artifact@v4
        with:
          name: mygo-app-bundle
          path: desktop/mygo/build/darwin-arm64/*.app
          if-no-files-found: error
          # 载荷里有隐藏文件（runtime/node/.node-version），upload-artifact v4.4 起
          # 默认丢弃隐藏文件，这里要的是完整 bundle，不是筛过的副本
          include-hidden-files: true
          # 1.8G 的 bundle 里全是已压缩的二进制，再 zlib 一遍只烧 runner 的时间
          compression-level: 0

  github-release:
    name: Create GitHub Release with desktop artifacts
    # 双轨期两路桌面包都要进同一个 Release：mygo 轨失败同样不创建 Release
    # （all-or-nothing 不变，只是多了一路）。
    needs: [npm-publish, build-desktop, build-desktop-mygo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # gh release create 需要仓库上下文（确定 repo、生成 notes），必须先 checkout
      - uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          # desktop-mac / desktop-win（Electron）与 desktop-mac-mygo（mygo 的 dmg）
          # 都进 dist/；mygo 的 .app 叫 mygo-app-bundle，故意不以 desktop- 开头，
          # 因为目录进 dist/ 会同时打断 sha256sum 与 gh release create。
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt

      # notes = 固定安装提示前缀（.github/release-preamble.md）+ 自动生成段落；
      # gh 不允许 --notes-file 与 --generate-notes 同用，因此先调 API 生成再拼接
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > "$RUNNER_TEMP/generated.md"
          cat .github/release-preamble.md "$RUNNER_TEMP/generated.md" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --title "dsh-trading $GITHUB_REF_NAME"
