<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<title>DeepSeek Harness</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0b1220; color: #dbe4f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    user-select: none; cursor: default;
  }
  .logo { width: 96px; height: 96px; margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: 0.02em; }
  .status { font-size: 13px; color: #8fa3c7; min-height: 18px; }
  .spinner {
    margin-top: 28px; width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(143, 163, 199, 0.25); border-top-color: #6ea8fe;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <img class="logo" src="./assets/icon.png" alt="" onerror="this.style.display='none'">
  <h1>DeepSeek Harness</h1>
  <div class="status" id="status">Starting…</div>
  <div class="spinner"></div>
  <script>
    const status = document.getElementById('status');
    if (window.desktop) window.desktop.onStatus((text) => { status.textContent = text; });
  </script>
</body>
</html>
