# User patch layer for the trading-web profile seeded by the desktop app.
# Applied after every bundle layer; the app preserves this file on reseed.
#
# 特殊指标中栏视图（2026-09-17，本地私有插件 @dshtrading/client-ui-special-indicators，
# 经 vendor tgz 随桌面载荷分发，不经 npm）：client 半注册中栏「特殊指标」tab；
# node 半挂 /dshtrading/api/special-indicators 白名单代理桥。凭据走凭据链
# （设置中心 credentials.finance → 环境变量 FINANCE_API_PASSWORD），本文件不落密码；
# 未配置时 tab 显示设置引导占位。卸载 = 删本行。
- insert:
    - id: dsh-trading-client-ui-special-indicators
      name: '@dshtrading/client-ui-special-indicators'
    - id: dsh-trading-client-ui-bot-gui
      name: '@dshtrading/client-ui-bot-gui'

# DSH 自带 Computer Use（2026-10-16）：单槽服务 + 原生 Cua Driver provider，
# 工具以 cua_driver_native__<upstream 名> 出现在会话工具面，截图走持久化附件，
# 所以被选中的模型路由必须声明 image 输入。
#
# 为什么落 profile 种子层而不是 base：base 是市场无关共享行的家，但它同时被
# trading-dev / trading-all 等 headless profile 挂载，那些 profile 的清单里没有
# 原生驱动依赖（@trycua/cua-driver 等），行插进 base 就会在那边解析不到、宿主每轮
# 启动报 failed to import。依赖只在桌面 seed 的生成清单里补齐
# （build-runtime.mjs 的 REGISTRY_DEPENDENCIES）。
#
# 一个部署只允许注册一个 computer-use provider：服务行持有唯一注册槽，这里由原生
# provider 占位。不要再挂 @deepseek-ai/dsh-experimental-computer-use-cua-driver-mcp
# ——第二个 provider 注册失败并报槽位已被占用。
#
# 挂载行本身不授予任何 macOS 权限：Screen Recording 与 Accessibility 属于启动这个
# 宿主的应用（DSH Trading.app），缺授权时工具照常注册、调用被系统拒绝。
- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
