packages:
  - packages/*

linkWorkspacePackages: true

# DSH SDK（@deepseek-ai/*）一律以 peerDependencies 声明，运行时由宿主 dsh 提供。
# 开发期/测试期从 npm 官方 @deepseek-ai 源解析 0.2.1-rc.2 世代（2026-10-21 cohort 升级，对齐宿主 dsh CLI 0.2.1-rc.2）。
# autoInstallPeers=true：把 SDK 声明/静态 import 的宿主 peer 集自动物化进本仓，确保
# vitest 能解析 defineTool 等入口的静态 peer import；发布语义不变（仍是 peers，不进
# dependencies）。本仓此前用 file:/link: overrides 钉到 DSH 源码 checkout（只读消费），
# 0.1.2-alpha.2 已从 npm 发布，overrides 已移除，不再依赖 checkout（checkout 保持只读）。
autoInstallPeers: true

# pnpm≥10 生命周期脚本默认拒绝，strict 模式下未批准直接报错；esbuild 的 postinstall
# 是平台二进制校验，显式放行（pnpm 11 的键为 allowBuilds，pnpm approve-builds 生成）。
strictDepBuilds: true
allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'
  # 当前世代各包已声明完整 peer 集；dsh-llm 在部分包只被声明、无依赖边物化，
  # 保留 ignoreMissing 作历史静默（dsh-invariants 已随官方停发移除，不再需要）。
  ignoreMissing:
    - '@deepseek-ai/dsh-llm'

# pnpm 11 的 minimumReleaseAge 会对「刚发布」的包设冷却期；0.2.1-rc.2 世代
# （及配套 cordis/cosmokit/schemastery/cordis-plugin-*）为最新发布，pnpm install
# 自动收录到该排除清单以放行解析。cohort 条目一律钉本世代版本，尾部保留非 cohort 的
# 第三方条目（@linxin666/*、@xmanrui/*、cordis-plugin-group）。
# dev cohort overrides：把 dsh 家族精确钉到 0.2.1-rc.2（2026-10-21 cohort 升级；
# dsh-invariants 随官方停发移除，新 peer 面由 dsh-working-directory 接替）。
# 必要性：pnpm 11 默认 minimumReleaseAge=1440min，刚发布的 cohort 会被跳过，宽 floor
# 与官方包宽 peer range 的边静默回退旧世代（2026-09-02
# profile 嵌入拷贝 identity-split 事故根源）；minimumReleaseAgeExclude 仅在域内无
# 年龄合格候选时兜底，对宽 range 不生效。overrides 在含传递 peer 的一切上下文强制
# 单一世代，保证单一模块实例。升 cohort 时整块替换。
