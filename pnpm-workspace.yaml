packages:
  - packages/*

linkWorkspacePackages: true

# 开发期 DSH SDK 解析（TEMPLATES §7）：npm 上 @deepseek-ai/dsh-* 只有不兼容的
# 0.0.1-rc.1，SDK 一律 peerDependencies 声明，这里用 overrides 把名字钉到官方
# checkout 的 file: 路径（只读消费，绝不修改 checkout）。运行时由宿主 dsh 提供。
overrides:
  '@deepseek-ai/cordis': 'file:/Users/zcl/code/deepseek-harness/vendor/cordis'
  # cordis/schemastery 内部依赖 cosmokit 用的是 workspace:^ 协议，装进本仓时同样需要钉到本地。
  '@deepseek-ai/cosmokit': 'file:/Users/zcl/code/deepseek-harness/vendor/cosmokit'
  '@deepseek-ai/schemastery': 'file:/Users/zcl/code/deepseek-harness/vendor/schemastery'
  '@deepseek-ai/dsh-tools': 'file:/Users/zcl/code/deepseek-harness/packages/core/tools'
  '@deepseek-ai/dsh-skill': 'file:/Users/zcl/code/deepseek-harness/packages/skill/skill'
  # base bundle 实装 dsh-agent-presets（preset 行解析进 profile 安装闭包，S3 坑 3）。
  # npm 没有宿主世代（最高 0.1.1-rc.2，宿主 0.1.2-alpha.1），开发期按 S3 实证用 link:
  # 钉到官方 checkout：它带真实 workspace:^ dependencies，file: 拷贝会在本仓连锁拖
  # 依赖（上方 dsh-tools 的既有教训），link: 让其依赖在 checkout 自身工作区解析。
  # 发布语义不受影响：dependencies 里仍是正式包名+版本 0.1.2-alpha.1，profile 安装
  # 时复用宿主解析；本 override 只作用于本仓开发期。
  '@deepseek-ai/dsh-agent-presets': 'link:/Users/zcl/code/deepseek-harness/packages/preset/agent-presets'
  # dsh-tools 的 lib barrel 运行时 import 这 4 个 peer（单测真正执行 defineTool 时需要；
  # 构建不执行所以此前未暴露）。link: 同上——真实路径在 checkout 内，它们自己的依赖
  # （dsh-timeout/dsh-util-crypto 等）继续由 checkout 工作区解析，不向本仓连锁。
  '@deepseek-ai/dsh-scope': 'link:/Users/zcl/code/deepseek-harness/packages/core/scope'
  '@deepseek-ai/dsh-llm': 'link:/Users/zcl/code/deepseek-harness/packages/llm/llm'
  '@deepseek-ai/dsh-session': 'link:/Users/zcl/code/deepseek-harness/packages/core/session'
  '@deepseek-ai/dsh-system-prompt': 'link:/Users/zcl/code/deepseek-harness/packages/core/system-prompt'

# file: 目标包声明的 peers（dsh-llm/dsh-scope 等）构建期用不到；自动拉取只会从
# npm 引入不兼容的 0.0.1-rc.1 时代版本。构建需要的 SDK 在 root devDependencies 显式列出。
autoInstallPeers: false

# pnpm≥10 生命周期脚本默认拒绝，strict 模式下未批准直接报错；esbuild 的 postinstall
# 是平台二进制校验，显式放行（pnpm 11 的键为 allowBuilds，pnpm approve-builds 生成）。
strictDepBuilds: true
allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'
  # dsh-skill/dsh-tools 声明的 workspace:^ 间接 peer 在宿主运行时由 DSH 提供；
  # 本地构建不需要，显式忽略（曾尝试 file: 钉住，会连锁拖入更多 workspace: 依赖，放弃）。
  ignoreMissing:
    - '@deepseek-ai/dsh-invariants'
    - '@deepseek-ai/dsh-llm'
